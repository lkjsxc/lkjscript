name: Verify
on:
  push:
    branches: ['verify/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  routine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: rustup show
      - name: Routine suite
        run: bash tools/check.sh
