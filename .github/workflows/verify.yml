name: Isolated map engineering
run-name: Map engineering ${{ github.sha }}

# Temporary campaign experiment, not source acceptance. Restore the maintained
# Verify workflow unchanged before selecting the complete integration candidate.
on:
  push:
    branches:
      - 'verify/202609191648-sustained'
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record source and pinned environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^ HEAD
          git rev-parse HEAD 'HEAD^{tree}'
          rustup show
          rustc --version --verbose
          uname -a
          free -h
          df -h .
      - name: Exercise independent storage oracle and failure cases
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --lib platform::execution::normalized::map::tests -- --nocapture
      - name: Report formatting delta without changing the candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
