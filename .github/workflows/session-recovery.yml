name: Recover interrupted engineering source
run-name: Recover source ${{ github.sha }}
on:
  push:
    branches: ['work/202609200012-sustained']
    paths: ['.github/workflows/session-recovery.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact commits since the retained offline bootstrap
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/session-recovery"
          mkdir -m 0700 "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          base=976e67e28dfb9f4eff3a24c904f179df21cbaf3c
          git merge-base --is-ancestor "$base" HEAD
          git bundle create "$out/source.bundle" HEAD "^$base"
          git bundle verify "$out/source.bundle"
          jq -n --arg source "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg base "$base" \
            '{source:$source,tree:$tree,repository:$repository,run:$run,attempt:$attempt,base:$base}' \
            > "$out/context.json"
          (cd "$out" && sha256sum source.bundle > source.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-recovery
          if-no-files-found: error
          retention-days: 14
