name: Session engineering 202609200012
run-name: Engineering bootstrap ${{ github.sha }}
on:
  push:
    branches: ['work/202609200012-sustained']
    paths: ['.github/workflows/session-engineering.yml']
permissions:
  contents: read
concurrency:
  group: engineering-202609200012
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '0'
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact public source and clean context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          out="$RUNNER_TEMP/session-source"
          mkdir -m 0700 "$out"
          git bundle create "$out/source.bundle" HEAD
          git bundle verify "$out/source.bundle"
          jq -n --arg source "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source:$source,tree:$tree,repository:$repository,run:$run,attempt:$attempt}' \
            > "$out/context.json"
          (cd "$out" && sha256sum source.bundle > source.sha256)
      - name: Transfer public source for offline inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-source-${{ github.sha }}
          path: ${{ runner.temp }}/session-source
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Provision pinned offline compiler and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          out="$RUNNER_TEMP/session-tooling"
          mkdir -m 0700 "$out"
          { rustc --version --verbose; cargo --version; uname -a; } > "$out/environment.txt"
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar --exclude='./share/doc' -czf "$out/toolchain.tar.gz" -C "$toolchain" .
          cargo vendor --locked "$RUNNER_TEMP/session-vendor" > "$out/vendor-config.toml"
          tar -czf "$out/vendor.tar.gz" -C "$RUNNER_TEMP/session-vendor" .
          (cd "$out" && sha256sum toolchain.tar.gz vendor.tar.gz > tooling.sha256)
      - name: Transfer offline public build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-tooling-${{ github.sha }}
          path: ${{ runner.temp }}/session-tooling
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Build and identify unmodified baseline product
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p lkjscript --bin lkjscript
          out="$RUNNER_TEMP/session-baseline"
          mkdir -m 0700 "$out"
          cp target/release/lkjscript "$out/lkjscript"
          cp "$RUNNER_TEMP/session-source/context.json" "$out/context.json"
          (cd "$out" && sha256sum lkjscript > product.sha256)
          "$out/lkjscript" capabilities > "$out/capabilities.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve baseline executable for ordinary public probes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/session-baseline
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
