name: Inspect v0.1.39 failure
run-name: Reconcile release source and original failure 35504414463
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-039-diagnosis.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out only the failed candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2bb72e4864485b73dc6aa152fb16ac34d4552285
          fetch-depth: 2
          persist-credentials: false
      - name: Reconcile original logs and exact source without executing the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = lkjsxc/lkjscript
          test "$(git rev-parse HEAD)" = 2bb72e4864485b73dc6aa152fb16ac34d4552285
          test -z "$(git status --porcelain=v1)"
          out="$RUNNER_TEMP/release-diagnosis"
          mkdir -m 0700 "$out"
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/actions/runs/35504414463/attempts/1" > "$out/run.json"
          jq -e '.id == 35504414463 and .run_attempt == 1
            and .repository.full_name == "lkjsxc/lkjscript"
            and .head_repository.full_name == "lkjsxc/lkjscript"
            and .head_sha == "2bb72e4864485b73dc6aa152fb16ac34d4552285"
            and .path == ".github/workflows/release.yml"
            and .event == "workflow_dispatch" and .status == "completed"
            and .conclusion == "failure"' "$out/run.json" > /dev/null
          gh api "$api/actions/artifacts/10603825475" > "$out/artifact.json"
          jq -e '.id == 10603825475 and .expired == false
            and .name == "candidate-diagnostics-35504414463-1"
            and .workflow_run.id == 35504414463
            and .workflow_run.head_sha == "2bb72e4864485b73dc6aa152fb16ac34d4552285"
            and .digest == "sha256:5aed778e6c4704c652c0eadc1b589b4de39988f17eb991972451e16cf8a2b9c9"' "$out/artifact.json" > /dev/null
          timeout 120 gh api "$api/actions/artifacts/10603825475/zip" > "$out/original.zip"
          printf '%s  %s\n' 5aed778e6c4704c652c0eadc1b589b4de39988f17eb991972451e16cf8a2b9c9 "$out/original.zip" | sha256sum --check --strict
          prefix=lkjscript/lkjscript/.artifacts/lkjscript-dev/check/1789899541488498295-6227-0
          marker=$(openssl rand -hex 16)
          printf '::stop-commands::%s\n' "$marker"
          printf '\nSOURCE IDENTITY\n'
          git rev-parse HEAD HEAD:tests/public_cli.rs
          sha256sum tests/public_cli.rs
          wc -l tests/public_cli.rs
          git ls-tree HEAD tests/map_predecessor.rs
          printf '\nEXACT REPORTED LOCATION\n'
          nl -ba tests/public_cli.rs | sed -n '1060,1120p'
          printf '\nREPORTED SYMBOLS IN SOURCE\n'
          git grep -n -e pure_preparation_capacity_fails_before_reference_recursion -e type_instantiation_storage -- tests src tools || test "$?" -eq 1
          printf '\nCAPTURED INPUT ENTRY\n'
          unzip -p "$out/original.zip" "$prefix/inputs.json" | jq '{top_keys:keys, matches:[..|objects|select(.path? == "tests/public_cli.rs" or .path? == "tests/map_predecessor.rs" or .path? == "Cargo.toml")]}'
          printf '\nORIGINAL FAILED SUMMARY\n'
          unzip -p "$out/original.zip" "$prefix/receipt.json" | jq '{status,profile,git_head,input_stable,passed_gates,unrun_gates,failed:[.gates[]|select(.status != "passed")|{id,status,command,reason}]}'
          printf '\nORIGINAL TEST FAILURE\n'
          unzip -p "$out/original.zip" "$prefix/workspace_tests.stdout.log" | tail -n 35
          printf '::%s::\n' "$marker"
          printf 'Reconciled only original text and exact source. No candidate execution, gate replay, tag, variable or release write.\n' >> "$GITHUB_STEP_SUMMARY"
