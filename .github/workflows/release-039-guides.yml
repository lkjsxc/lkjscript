name: Inspect v0.1.39 guide preflight
run-name: Read original guide preflight 35508041506
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-039-guides.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate original evidence and display bounded text only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = lkjsxc/lkjscript
          out="$RUNNER_TEMP/guide-preflight"
          mkdir -m 0700 "$out"
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/actions/runs/35508041506/attempts/1" > "$out/run.json"
          jq -e '.head_sha == "acd03dde962c082711c0453930cd1abd87c2aedd"
            and .path == ".github/workflows/release-039-guides.yml"
            and .event == "push" and .status == "completed" and .conclusion == "failure"' "$out/run.json" > /dev/null
          gh api "$api/actions/artifacts/10604253456" > "$out/artifact.json"
          jq -e '.workflow_run.id == 35508041506 and .expired == false
            and .name == "release-039-guides-35508041506-1"
            and .digest == "sha256:1f64ce628458f6e935f2815435abe9fd9ad540c830afdbf2a5390348c2609841"' "$out/artifact.json" > /dev/null
          timeout 60 gh api "$api/actions/artifacts/10604253456/zip" > "$out/original.zip"
          printf '%s  %s\n' 1f64ce628458f6e935f2815435abe9fd9ad540c830afdbf2a5390348c2609841 "$out/original.zip" | sha256sum --check --strict
          unzip -Z1 "$out/original.zip" > "$out/members.txt"
          marker=$(openssl rand -hex 16)
          printf '::stop-commands::%s\n' "$marker"
          cat "$out/members.txt"
          for name in before.exit before.stdout before.stderr generator.sha256 toolchain.txt build.stderr; do
            test "$(grep -Fxc "$name" "$out/members.txt")" -eq 1
            printf '\n--- %s ---\n' "$name"
            unzip -p "$out/original.zip" "$name" | tail -n 45
          done
          printf '::%s::\n' "$marker"
          printf 'Original preflight inspection only. No executable run, source or test change, tag, variable, release, or acceptance replay.\n' >> "$GITHUB_STEP_SUMMARY"
