name: Bounded reproduction inputs
run-name: Reproduction inputs ${{ github.sha }}
# Temporary investigation branch; no publication, deployment or ref mutation.
on:
  push:
    branches: ['work/acceptance-reproduction-20261003']
    paths: ['.github/workflows/acceptance-reproduction.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve the exact credential-free kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/lkjsxc/lkjscript/actions/artifacts/11263643036 \
            --jq '{id,name,digest,workflow_run}'
          gh run download 37093670285 --repo lkjsxc/lkjscript \
            --name reproduction-kit-b9170803c63ca7a8fd9321422b461999afba92a8-37093670285-1 \
            --dir "$RUNNER_TEMP/kit"
      - name: Preserve exact bytes in bounded pieces
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kit"
          sha256sum -c reproduction-kit.sha256
          split -b 48M reproduction-kit.tar.zst part-
          test "$(find . -maxdepth 1 -name 'part-*' | wc -l)" = 7
          sha256sum part-* > parts.sha256
          mkdir context
          tar --zstd -xf reproduction-kit.tar.zst -C context ./source ./provenance.txt
          cp reproduction-kit.sha256 parts.sha256 context/
      - name: Source and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-source-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/context
          include-hidden-files: true
          retention-days: 7
      - name: Part aa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-aa-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-aa
          compression-level: 0
          retention-days: 7
      - name: Part ab
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-ab
          compression-level: 0
          retention-days: 7
      - name: Part ac
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-ac-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-ac
          compression-level: 0
          retention-days: 7
      - name: Part ad
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-ad-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-ad
          compression-level: 0
          retention-days: 7
      - name: Part ae
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-ae-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-ae
          compression-level: 0
          retention-days: 7
      - name: Part af
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-af-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-af
          compression-level: 0
          retention-days: 7
      - name: Part ag
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproduction-ag-${{ github.run_id }}
          path: ${{ runner.temp }}/kit/part-ag
          compression-level: 0
          retention-days: 7
