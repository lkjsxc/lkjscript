name: Foreground repair focused verification
run-name: Foreground regression d60cf24d5a4f3a82d1725f607545b13d1593485b
# Temporary diagnostic workflow. Full acceptance is separately bound to verify.yml.
on:
  push:
    branches: ['work/acceptance-reproduction-20261003']
    paths: ['.github/workflows/acceptance-reproduction.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: d60cf24d5a4f3a82d1725f607545b13d1593485b
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out the exact integration without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d60cf24d5a4f3a82d1725f607545b13d1593485b
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the source and run all new policy regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = d8e249e3bcabe061a6471e59257f3de14e9cd822
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -m 0700 "$RUNNER_TEMP/focused-evidence"
          jq -n --arg source "$SOURCE_SHA" --arg controller "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source:$source,controller:$controller,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/focused-evidence/context.json"
          rustup show
          cargo test --release --locked -p lkjscript-dev --lib \
            offline_packages::foreground::policy::tests -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/focused-evidence/unit-tests.log"
      - name: Build and copy the source-matched runtime and verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p lkjscript --bin lkjscript \
            -p lkjscript-dev --bin lkjscript-dev 2>&1 \
            | tee "$RUNNER_TEMP/focused-evidence/build.log"
          mkdir -m 0700 "$RUNNER_TEMP/focused-bin"
          cp target/release/lkjscript target/release/lkjscript-dev "$RUNNER_TEMP/focused-bin/"
          chmod 0500 "$RUNNER_TEMP/focused-bin/"*
          sha256sum "$RUNNER_TEMP/focused-bin/"* \
            > "$RUNNER_TEMP/focused-evidence/binaries.sha256"
      - name: Execute the complete standalone offline composition oracle
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/focused-bin/lkjscript-dev" offline-packages \
            --binary "$RUNNER_TEMP/focused-bin/lkjscript" \
            --evidence-root "$RUNNER_TEMP/focused-evidence/offline-packages" --machine \
            2>&1 | tee "$RUNNER_TEMP/focused-evidence/offline.jsonl"
      - name: Retain exact loop observations and verify unchanged source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          receipt="$RUNNER_TEMP/focused-evidence/offline-packages/receipt.json"
          if test -f "$receipt"; then
            jq '{schema,status,failure,cleanup_complete,candidate_sha256,verifier_sha256,
              command_count:(.commands|length),foreground_cells:(.effects.foreground.cells|length),
              failure_cells:(.effects.foreground.failures|length),
              loops:[.effects.foreground.loops[] | {label,n,bounded,output,
                observation:(.execution["production-observation"]|fromjson)}]}' "$receipt" \
              | tee "$RUNNER_TEMP/focused-evidence/result.json"
          fi
      - name: Retain focused evidence including failure details
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foreground-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
