name: check
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Gate dependencies
        # C builds independent syscall witnesses; the compiler bootstraps from its seed.
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates gcc libc6-dev
      - uses: actions/checkout@v4
      - name: Seed-only compiler bootstrap
        run: |
          for tool in cargo rustc node nodejs; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'unexpected bootstrap tool: %s\n' "$tool" >&2
              exit 1
            fi
          done
          test ! -d target/store
          sh tools/bootstrap.sh
      - name: Native gate
        env:
          LKJSCRIPT_GATE_JOBS: '4'
        run: |
          for tool in cargo rustc curl node nodejs; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'unexpected gate tool: %s\n' "$tool" >&2
              exit 1
            fi
            printf 'gate tool absent: %s\n' "$tool"
          done
          bash tools/check.sh
      - name: Record compiler identities
        run: |
          printf '%s\n' "$GITHUB_SHA"
          sha256sum target/lkjscript seed/lkjscript.gz
  real-program-host-tools:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Host-tool dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates nodejs
      - uses: actions/checkout@v4
      - name: Source census
        run: node tools/real-programs/census.mjs --self-test
      - name: Git projection
        run: node tools/real-programs/project.mjs --self-test
      - name: Compiler observation
        run: node tools/real-programs/probe-test.mjs
  witness:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sh tools/bootstrap.sh
      - run: bash witness/check.sh
      - name: Record compiler identities
        run: |
          printf '%s\n' "$GITHUB_SHA"
          sha256sum target/lkjscript seed/lkjscript.gz
