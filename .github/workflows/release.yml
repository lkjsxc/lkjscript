name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Candidate production or explicitly selected consumption boundary
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - consume
          - promote
          - resume-publication
          - resume-public
      producer_run:
        description: Exact accepted producer run ID (required for consumption)
        required: false
        type: string
      producer_attempt:
        description: Exact original producer attempt (required for consumption)
        required: false
        type: string
      latest:
        description: Public recheck requires selected latest, or records supersession
        required: true
        default: required
        type: choice
        options:
          - required
          - allow-superseded

# Candidate work is independent. Every consumer observing or mutating shared
# release/latest state uses one serialized group, including public-only resumption.
concurrency:
  group: release-${{ inputs.operation == 'candidate' && github.run_id || 'publication-and-latest' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_ARCHIVE_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  candidate:
    name: Accept final candidate
    if: inputs.operation == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the immutable mainline controller and product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned host toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          source_head=$(git rev-parse HEAD)
          test "$source_head" = "$GITHUB_WORKFLOW_SHA"
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.98.0
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies and build immutable host tools
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          capture_bootstrap_source() {
            source_head=$(git rev-parse HEAD) || return "$?"
            source_tree=$(git rev-parse 'HEAD^{tree}') || return "$?"
            source_status=$(git status --porcelain=v1 --untracked-files=all) || return "$?"
            jq -n --arg source "$source_head" --arg tree "$source_tree" --arg status "$source_status" \
              '{source:$source,tree:$tree,status:$status}' > "$1"
          }
          bootstrap_value_hash() {
            local line
            line=$(printf '%s' "$1" | sha256sum) || return "$?"
            printf '%s' "${line%% *}"
          }
          bootstrap_file_proof() {
            local path=$1 maximum=$2 parent next before after mode bytes hash rest
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              parent=$(dirname -- "$path") || return "$?"
              while [[ ! -e "$parent" && ! -L "$parent" ]]; do
                next=$(dirname -- "$parent") || return "$?"
                [[ "$next" != "$parent" ]] || return 1
                parent=$next
              done
              [[ -d "$parent" && -x "$parent" ]] || return 1
              jq -cn --arg path "$path" '{path:$path,kind:"absent"}'
              return "$?"
            fi
            if [[ ! -f "$path" || -L "$path" ]]; then
              jq -cn --arg path "$path" '{path:$path,kind:"unsupported"}'
              return "$?"
            fi
            before=$(stat -c '%a|%s|%d|%i|%y|%z' -- "$path") || return "$?"
            IFS='|' read -r mode bytes rest <<< "$before"
            [[ "$mode" =~ ^[0-7]+$ && "$bytes" =~ ^[0-9]+$ ]] || return 1
            printf -v mode '%04o' "$((8#$mode))"
            if (( bytes > maximum )); then
              jq -cn --arg path "$path" --arg mode "$mode" --argjson bytes "$bytes" \
                '{path:$path,mode:$mode,kind:"oversized",bytes:$bytes}'
              return "$?"
            fi
            hash=$(head -c "$((maximum + 1))" -- "$path" | sha256sum) || return "$?"
            after=$(stat -c '%a|%s|%d|%i|%y|%z' -- "$path") || return "$?"
            [[ "$before" == "$after" ]] || return 1
            jq -cn --arg path "$path" --arg mode "$mode" --argjson bytes "$bytes" \
              --arg sha256 "${hash%% *}" '{path:$path,mode:$mode,kind:"file",bytes:$bytes,sha256:$sha256}'
          }
          bootstrap_context() {
            local output=$1 repo name value digest item kind current next paths sorted exported bytes
            local parent_environment='{}' override_states='{}' configs='[]' errors='[]'
            local cargo_proof rustc_proof child_environment count=0 total=0
            local -A candidates=() overrides=()
            repo=$(readlink -e "$PWD") || return "$?"
            if [[ "$repo" != "$PWD" ]]; then errors=$(jq -c '.+=["checkout is not canonical"]' <<< "$errors") || return "$?"; fi
            for name in HOME bootstrap_cargo_home bootstrap_rustup_home bootstrap_target; do
              value=${!name}
              current=$(readlink -m -- "$value") || return "$?"
              if [[ "$value" != /* || "$current" != "$value" ]]; then
                errors=$(jq -c --arg name "$name" '.+=["path absent or not canonical: "+$name]' <<< "$errors") || return "$?"
              fi
            done
            [[ -n "$PATH" ]] || return 1
            for name in HOME PATH CARGO_HOME RUSTUP_HOME LANG LC_ALL TMPDIR TZ CARGO_TERM_COLOR CARGO_NET_OFFLINE \
              CARGO_BUILD_JOBS CARGO_ABOUT_VERSION CARGO_ABOUT_ARCHIVE_SHA256; do
              if [[ -v "$name" ]]; then
                value=${!name}
                digest=$(bootstrap_value_hash "$value") || return "$?"
                parent_environment=$(jq -c --arg name "$name" --arg sha256 "$digest" \
                  '.[$name]={state:"set",value_sha256:$sha256}' <<< "$parent_environment") || return "$?"
                if [[ ( "$name" == CARGO_HOME || "$name" == RUSTUP_HOME ) && -z "$value" ]]; then
                  errors=$(jq -c --arg name "$name" '.+=["empty home override: "+$name]' <<< "$errors") || return "$?"
                fi
              else
                parent_environment=$(jq -c --arg name "$name" '.[$name]={state:"unset"}' <<< "$parent_environment") || return "$?"
              fi
            done
            for name in AR CC CFLAGS CXX CXXFLAGS PKG_CONFIG_PATH RANLIB RUSTC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER \
              RUSTFLAGS RUSTDOC RUSTDOCFLAGS RUSTC_BOOTSTRAP RUSTUP_TOOLCHAIN SOURCE_DATE_EPOCH CARGO_BUILD_TARGET \
              CARGO_ENCODED_RUSTFLAGS CARGO_ENCODED_RUSTDOCFLAGS CARGO_TARGET_DIR; do overrides[$name]=1; done
            exported=$(compgen -e) || return "$?"
            while IFS= read -r name; do
              case "$name" in
                CARGO_HOME|CARGO_NET_OFFLINE|CARGO_TERM_COLOR|CARGO_BUILD_JOBS|CARGO_ABOUT_VERSION|CARGO_ABOUT_ARCHIVE_SHA256) ;;
                CARGO_*) overrides[$name]=1 ;;
              esac
            done <<< "$exported"
            sorted=$(printf '%s\n' "${!overrides[@]}" | LC_ALL=C sort) || return "$?"
            while IFS= read -r name; do
              if [[ -v "$name" ]]; then
                digest=$(bootstrap_value_hash "${!name}") || return "$?"
                override_states=$(jq -c --arg name "$name" --arg sha256 "$digest" \
                  '.[$name]={state:"set",value_sha256:$sha256}' <<< "$override_states") || return "$?"
                errors=$(jq -c --arg name "$name" '.+=["unsupported build override: "+$name]' <<< "$errors") || return "$?"
              else
                override_states=$(jq -c --arg name "$name" '.[$name]={state:"unset"}' <<< "$override_states") || return "$?"
              fi
            done <<< "$sorted"
            current=$repo
            while :; do
              (( count += 1 )); (( count <= 64 )) || return 1
              candidates["${current%/}/.cargo/config"]=1; candidates["${current%/}/.cargo/config.toml"]=1
              [[ "$current" != / ]] || break
              next=$(dirname -- "$current") || return "$?"
              current=$next
            done
            candidates["${bootstrap_cargo_home%/}/config"]=1; candidates["${bootstrap_cargo_home%/}/config.toml"]=1
            (( ${#candidates[@]} <= 130 )) || return 1
            paths=$(printf '%s\n' "${!candidates[@]}" | LC_ALL=C sort) || return "$?"
            while IFS= read -r current; do
              item=$(bootstrap_file_proof "$current" 1048576) || return "$?"
              kind=$(jq -er '.kind' <<< "$item") || return "$?"
              configs=$(jq -c --argjson item "$item" '.+=[$item]' <<< "$configs") || return "$?"
              bytes=$(jq -er '.bytes // 0' <<< "$item") || return "$?"
              total=$((total + bytes)); (( total <= 8388608 )) || return 1
              if [[ "$kind" != absent ]]; then
                errors=$(jq -c '.+=["bootstrap requires absent effective Cargo configs"]' <<< "$errors") || return "$?"
              fi
            done <<< "$paths"
            cargo_proof=$(bootstrap_file_proof "$bootstrap_cargo" 536870912) || return "$?"
            rustc_proof=$(bootstrap_file_proof "$bootstrap_rustc" 536870912) || return "$?"
            if ! jq -e --argjson cargo "$cargo_proof" --argjson rustc "$rustc_proof" \
              '$cargo.kind=="file" and $rustc.kind=="file" and ($cargo.path|startswith("/")) and ($rustc.path|startswith("/"))' \
              <<< null > /dev/null; then errors=$(jq -c '.+=["compiler/Cargo is not a regular absolute file"]' <<< "$errors") || return "$?"; fi
            child_environment=$(jq -cn --args '$ARGS.positional|map(split("=")|{key:.[0],value:(.[1:]|join("="))})|from_entries' \
              "${bootstrap_env[@]}") || return "$?"
            if [[ -v CARGO_BUILD_JOBS && ! "$CARGO_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]; then
              errors=$(jq -c '.+=["CARGO_BUILD_JOBS must be a positive integer"]' <<< "$errors") || return "$?"
            fi
            jq -nS --arg repo "$repo" --arg target "$bootstrap_target" --argjson errors "$errors" \
              --argjson parent "$parent_environment" --argjson overrides "$override_states" --argjson configs "$configs" \
              --argjson cargo "$cargo_proof" --argjson rustc "$rustc_proof" --argjson child "$child_environment" \
              '{schema:"lkjscript.bootstrap_context.no_config_no_override.v1",repository:$repo,target:$target,
                supported:($errors|length==0),errors:$errors,parent_environment:$parent,override_states:$overrides,
                configs:$configs,executables:{cargo:$cargo,rustc:$rustc},child_environment:$child}' > "$output"
          }
          bootstrap_root=$(mktemp -d "$RUNNER_TEMP/candidate-bootstrap.XXXXXXXX")
          bootstrap_target="$bootstrap_root/target"
          test -d "$bootstrap_root" && test ! -L "$bootstrap_root"
          test ! -e "$bootstrap_target" && test ! -L "$bootstrap_target"
          evidence="$RUNNER_TEMP/bootstrap-evidence"
          mkdir -m 0700 "$evidence" "$RUNNER_TEMP/trusted-tools"
          bootstrap_cargo=$(rustup which --toolchain 1.98.0 cargo)
          bootstrap_cargo=$(readlink -e "$bootstrap_cargo")
          bootstrap_rustc=$(rustup which --toolchain 1.98.0 rustc)
          bootstrap_rustc=$(readlink -e "$bootstrap_rustc")
          bootstrap_sysroot=$("$bootstrap_rustc" --print sysroot)
          bootstrap_sysroot_rustc=$(readlink -e "$bootstrap_sysroot/bin/rustc")
          test "$bootstrap_sysroot_rustc" = "$bootstrap_rustc"
          bootstrap_cargo_home=${CARGO_HOME-$HOME/.cargo}
          bootstrap_rustup_home=${RUSTUP_HOME-$HOME/.rustup}
          bootstrap_env=(
            "HOME=$HOME" "PATH=$PATH" "CARGO_HOME=$bootstrap_cargo_home" "RUSTUP_HOME=$bootstrap_rustup_home"
            "CARGO_TARGET_DIR=$bootstrap_target" "RUSTC=$bootstrap_rustc" "CARGO_NET_OFFLINE=true"
            "CARGO_TERM_COLOR=never" "LANG=C"
          )
          if [[ -v CARGO_BUILD_JOBS ]]; then bootstrap_env+=("CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"); fi
          capture_bootstrap_source "$evidence/bootstrap-source-before.json"
          bootstrap_context "$evidence/bootstrap-context-before.json"
          jq -e ' .supported == true ' "$evidence/bootstrap-context-before.json" > /dev/null
          jq -e --arg expected "$GITHUB_SHA" '.source == $expected and .status == ""' \
            "$evidence/bootstrap-source-before.json" > /dev/null
          { "$bootstrap_cargo" --version; "$bootstrap_rustc" --version --verbose; } > "$evidence/bootstrap-toolchain.txt"
          jq -n --arg target "$bootstrap_target" --arg cwd "$PWD" --arg cargo "$bootstrap_cargo" \
            --slurpfile context "$evidence/bootstrap-context-before.json" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{cwd:$cwd,started_at:$started_at,launcher:["env","-i"],environment:$context[0].child_environment,argv:[$cargo,"build","--release","--locked","-p","lkjscript-dev","--bins","--target-dir",$target,"--message-format=json"]}' \
            > "$evidence/bootstrap-command.json"
          set +e
          env -i "${bootstrap_env[@]}" "$bootstrap_cargo" build --release --locked -p lkjscript-dev --bins \
            --target-dir "$bootstrap_target" --message-format=json \
            > "$evidence/bootstrap-cargo.jsonl" 2> "$evidence/bootstrap-cargo.stderr"
          bootstrap_status=$?
          set -e
          jq -n --argjson exit_code "$bootstrap_status" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{completed_at:$completed_at,exit_code:$exit_code}' > "$evidence/bootstrap-process.json"
          capture_bootstrap_source "$evidence/bootstrap-source-after.json"
          bootstrap_context "$evidence/bootstrap-context-after.json"
          test "$bootstrap_status" -eq 0
          cmp "$evidence/bootstrap-source-before.json" "$evidence/bootstrap-source-after.json"
          cmp "$evidence/bootstrap-context-before.json" "$evidence/bootstrap-context-after.json"
          jq -e ' .supported == true ' "$evidence/bootstrap-context-after.json" > /dev/null
          jq -e -s --arg manifest "$GITHUB_WORKSPACE/tools/lkjscript-dev/Cargo.toml" \
            --arg source_root "$GITHUB_WORKSPACE/tools/lkjscript-dev/src" \
            --arg workspace "$GITHUB_WORKSPACE/" \
            --arg target "$bootstrap_target/release" \
            --slurpfile source "$evidence/bootstrap-source-before.json" '
            def tool($name; $entry):
              [.[] | select(.reason == "compiler-artifact" and .manifest_path == $manifest
                and .target.name == $name and .target.kind == ["bin"]
                and .target.src_path == ($source_root + "/" + $entry)
                and .profile.test == false and .profile.opt_level == "3"
                and .fresh == false and .executable == ($target + "/" + $name))]
              | if length == 1 then .[0] else error("missing or ambiguous fresh bootstrap artifact") end;
            [.[] | select(.reason == "compiler-artifact"
              and (.manifest_path | startswith($workspace)))] as $workspace_artifacts
            | if ($workspace_artifacts | length) == 0
              or any($workspace_artifacts[]; .fresh != false)
              then error("bootstrap workspace artifact was not freshly built") else . end
            | [.[] | select(.reason == "build-finished")] as $finished
            | if ($finished | length) != 1 or $finished[0].success != true
              then error("bootstrap did not finish successfully") else . end
            | tool("lkjscript-dev"; "main.rs") as $checker
            | tool("lkjscript-release-controller"; "release/controller_main.rs") as $controller
            | {source:$source[0],checker:$checker,controller:$controller,build_finished:$finished[0],workspace_artifacts:$workspace_artifacts}
            ' "$evidence/bootstrap-cargo.jsonl" > "$evidence/bootstrap-selection.json"
          checker=$(jq -er '.checker.executable' "$evidence/bootstrap-selection.json")
          test -f "$checker" && test ! -L "$checker"
          controller=$(jq -er '.controller.executable' "$evidence/bootstrap-selection.json")
          test -f "$controller" && test ! -L "$controller"
          cp "$checker" "$RUNNER_TEMP/trusted-tools/lkjscript-dev"
          cp "$controller" "$RUNNER_TEMP/trusted-tools/lkjscript-release-controller"
          chmod 0555 "$RUNNER_TEMP/trusted-tools/lkjscript-dev"
          chmod 0555 "$RUNNER_TEMP/trusted-tools/lkjscript-release-controller"
          cmp "$checker" "$RUNNER_TEMP/trusted-tools/lkjscript-dev"
          cmp "$controller" "$RUNNER_TEMP/trusted-tools/lkjscript-release-controller"
          sha256sum "$checker" "$controller" "$RUNNER_TEMP/trusted-tools/"* \
            > "$evidence/tools.sha256"
          sha256sum "$evidence"/bootstrap-* > "$evidence/bootstrap-evidence.sha256"
          echo "VERIFIER=$RUNNER_TEMP/trusted-tools/lkjscript-dev" >> "$GITHUB_ENV"

      - name: Authenticate candidate source and controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trusted-tools/lkjscript-release-controller" candidate-context \
            --output "$RUNNER_TEMP/candidate-context"

      - name: Download and verify pinned cargo-about
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-about.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_ABOUT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -m 0700 "$RUNNER_TEMP/cargo-about"
          tar -xzf "$archive" --strip-components=1 --directory "$RUNNER_TEMP/cargo-about" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/cargo-about"
          chmod 0755 "$RUNNER_TEMP/cargo-about/cargo-about"
          test "$("$RUNNER_TEMP/cargo-about/cargo-about" --version)" = "cargo-about ${CARGO_ABOUT_VERSION}"

      - name: Provision target policy and pinned userlands
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          "$VERIFIER" release target > "$RUNNER_TEMP/target-policy.json"
          target_triple=$(jq -er '.policy.target_triple' "$RUNNER_TEMP/target-policy.json")
          rustup target add --toolchain 1.98.0 "$target_triple"
          mkdir -m 0700 "$RUNNER_TEMP/musl-packages"
          packages=()
          while IFS=$'\t' read -r name url digest; do
            [[ "$name" =~ ^musl(-dev|-tools)?_[0-9][0-9A-Za-z.+:~-]*_amd64\.deb$ ]]
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            file="$RUNNER_TEMP/musl-packages/$name"
            curl --fail --location --silent --show-error --output "$file" "$url"
            printf '%s  %s\n' "$digest" "$file" | sha256sum --check --strict
            packages+=("$file")
          done < <(jq -r '.policy.musl_packages[] | [.file_name,.url,.sha256] | @tsv' "$RUNNER_TEMP/target-policy.json")
          test "${#packages[@]}" -eq 3
          sudo dpkg --install "${packages[@]}"
          test "$(musl-gcc -dumpmachine)" = x86_64-linux-gnu
          while IFS= read -r image; do
            timeout 10m docker pull --platform linux/amd64 "$image"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          done < <(jq -r '.policy.userlands[].image' "$RUNNER_TEMP/target-policy.json")

      - name: Run source-specific acceptance with the immutable verifier
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # Keep workspace tests and release lifecycle Cargo builds from overlapping.
          # First CHECK8 profile requires a cold governed target; never erase an existing target.
          test ! -e "$GITHUB_WORKSPACE/target" && test ! -L "$GITHUB_WORKSPACE/target"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            "$VERIFIER" check release-source --fresh --jobs 1 --machine | tee "$RUNNER_TEMP/source-summary.json"
          relative=$(jq -er '.receipt' "$RUNNER_TEMP/source-summary.json")
          [[ "$relative" == .artifacts/lkjscript-dev/check/*/receipt.json ]]
          [[ ! "$relative" =~ (^|/)\.\.(/|$) ]]
          echo "receipt=$GITHUB_WORKSPACE/$relative" >> "$GITHUB_OUTPUT"

      - name: Build product once and finalize the three distributable assets
        id: content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/candidate-build" "$RUNNER_TEMP/candidate-acceptance"
          "$VERIFIER" release build --output "$RUNNER_TEMP/candidate-build/lkjscript" \
            --receipt "$RUNNER_TEMP/candidate-build/build-receipt.json"
          version=$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          tag="v$version"
          "$VERIFIER" release prepare --candidate "$RUNNER_TEMP/candidate-build/lkjscript" \
            --cargo-about "$RUNNER_TEMP/cargo-about/cargo-about" \
            --cargo-about-archive "$RUNNER_TEMP/cargo-about.tar.gz" \
            --output "$RUNNER_TEMP/candidate-assets" --tag "$tag"
          "$VERIFIER" release verifier prepare --executable "$VERIFIER" \
            --output "$RUNNER_TEMP/candidate-verifier" --tag "$tag" --commit "$GITHUB_SHA"

      - name: Admit the final candidate and original evidence
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/candidate-verifier/lkjscript-dev" release candidate accept \
            --assets "$RUNNER_TEMP/candidate-assets" \
            --source-receipt "${{ steps.source.outputs.receipt }}" \
            --build-receipt "$RUNNER_TEMP/candidate-build/build-receipt.json" \
            --verifier-identity "$RUNNER_TEMP/candidate-verifier/verifier-identity.json" \
            --evidence-root "$RUNNER_TEMP/candidate-evidence" \
            --output "$RUNNER_TEMP/candidate-acceptance/release-receipt.json"

      - name: Upload immutable candidate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload original candidate verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-verifier/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload essential acceptance handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-acceptance/release-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain original diagnostics including failed boundaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-context
            ${{ runner.temp }}/bootstrap-evidence
            ${{ runner.temp }}/source-summary.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/check
            ${{ github.workspace }}/.artifacts/lkjscript-dev/service
            ${{ runner.temp }}/candidate-build/build-receipt*
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-acceptance
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  controller:
    name: Select exact accepted producer
    if: inputs.operation != 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      tool_artifact: ${{ steps.tool-upload.outputs.artifact-id }}
      tool_sha256: ${{ steps.tool.outputs.sha256 }}
      selection_artifact: ${{ steps.selection-upload.outputs.artifact-id }}
      authority: ${{ steps.authority.outputs.status }}
    steps:
      - name: Check out trusted mainline controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted controller without publication credentials
        id: tool
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          rustup toolchain install 1.98.0 --profile minimal
          cargo build --release --locked -p lkjscript-dev --bin lkjscript-release-controller
          mkdir -m 0700 "$RUNNER_TEMP/controller-tool"
          cp target/release/lkjscript-release-controller "$RUNNER_TEMP/controller-tool/lkjscript-release-controller"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/controller-tool/lkjscript-release-controller" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Preserve trusted controller before any transferred execution
        id: tool-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-tool/lkjscript-release-controller
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Authenticate and select original producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/controller-tool/lkjscript-release-controller" select \
            --producer-run "$PRODUCER_RUN" --producer-attempt "$PRODUCER_ATTEMPT" \
            --output "$RUNNER_TEMP/selection"
      - name: Independently admit current publication authority and occupancy
        id: authority
        if: inputs.operation != 'resume-public'
        env:
          GH_TOKEN: ${{ github.token }}
          LKJSCRIPT_IMMUTABLE_RELEASE_TAG_OBJECT_SHA: ${{ vars.LKJSCRIPT_IMMUTABLE_RELEASE_TAG_OBJECT_SHA }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/controller-tool/lkjscript-release-controller" authority \
              --selection "$RUNNER_TEMP/selection/selection.json" --output "$RUNNER_TEMP/authority"; then
            jq -e -s 'length == 1 and .[0].status == "promotion_authorized"' \
              "$RUNNER_TEMP/authority/state.json" > /dev/null
            echo 'status=authorized' >> "$GITHUB_OUTPUT"
          else
            observed=$(jq -e -r -s 'select(length == 1) | .[0] |
              select(.operation == "authority" and (.reason | type == "string" and length > 0)) |
              .status | select(. == "rejected" or . == "unavailable" or . == "cancelled")' \
              "$RUNNER_TEMP/authority/state.json")
            echo "status=$observed" >> "$GITHUB_OUTPUT"
            test "$OPERATION" = consume && test "$observed" = rejected
          fi
      - name: Admit transfer and run the small installed lifecycle
        if: inputs.operation == 'consume' || inputs.operation == 'promote'
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/selection/selection.json"
          cp -R "$RUNNER_TEMP/selection/assets" "$RUNNER_TEMP/transfer-latest"
          verifier="$RUNNER_TEMP/selection/verifier/lkjscript-dev"
          chmod 0755 "$verifier"
          env -i PATH="$PATH" HOME="$HOME" LANG=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            "$verifier" release transferred pair-run \
            --exact-assets "$RUNNER_TEMP/selection/assets" --latest-assets "$RUNNER_TEMP/transfer-latest" \
            --tag "$(jq -er '.content.tag' "$selection")" --commit "$(jq -er '.content.source_commit' "$selection")" \
            --acquisition simulated --evidence-root "$RUNNER_TEMP/transfer-smoke" \
            --verifier-identity "$RUNNER_TEMP/selection/verifier/verifier-identity.json" \
            --expected-verifier-sha256 "$(jq -er '.content.verifier.sha256' "$selection")" \
            --expected-verifier-bytes "$(jq -er '.content.verifier.byte_length' "$selection")"
      - name: Upload authenticated selection unchanged
        id: selection-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/selection.json
            ${{ runner.temp }}/selection/assets
            ${{ runner.temp }}/selection/verifier
            ${{ runner.temp }}/selection/acceptance
            ${{ runner.temp }}/selection/assets.zip
            ${{ runner.temp }}/selection/verifier.zip
            ${{ runner.temp }}/selection/acceptance.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain selection and transfer decisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/state.json
            ${{ runner.temp }}/selection/*-members
            ${{ runner.temp }}/selection/operations
            ${{ runner.temp }}/authority
            ${{ runner.temp }}/transfer-smoke
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Resume immutable publication boundary
    needs: controller
    if: (inputs.operation == 'promote' || inputs.operation == 'resume-publication') && needs.controller.result == 'success' && needs.controller.outputs.authority == 'authorized'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Receive trusted controller by this invocation's artifact identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.controller.outputs.tool_artifact }}
          path: ${{ runner.temp }}/controller
          merge-multiple: true
      - name: Receive authenticated original candidate selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.controller.outputs.selection_artifact }}
          path: ${{ runner.temp }}/selection
          merge-multiple: true
      - name: Reauthenticate and publish only exact missing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROLLER_SHA256: ${{ needs.controller.outputs.tool_sha256 }}
          LKJSCRIPT_IMMUTABLE_RELEASE_TAG_OBJECT_SHA: ${{ vars.LKJSCRIPT_IMMUTABLE_RELEASE_TAG_OBJECT_SHA }}
        run: |
          set -euo pipefail
          controller="$RUNNER_TEMP/controller/lkjscript-release-controller"
          test -f "$controller" && test ! -L "$controller"
          printf '%s  %s\n' "$EXPECTED_CONTROLLER_SHA256" "$controller" | sha256sum --check --strict
          chmod 0555 "$controller"
          "$controller" publish --selection "$RUNNER_TEMP/selection/selection.json" \
            --output "$RUNNER_TEMP/publication"
      - name: Retain publication boundary including genuine failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: warn
          retention-days: 14

  public:
    name: Resume anonymous acquisition and small smoke
    needs: [controller, publish]
    if: always() && needs.controller.result == 'success' && (inputs.operation == 'resume-public' || ((inputs.operation == 'promote' || inputs.operation == 'resume-publication') && needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      latest_state: ${{ steps.public-identity.outputs.latest_state }}
      latest_tag: ${{ steps.public-identity.outputs.latest_tag }}
      latest_source: ${{ steps.public-identity.outputs.latest_source }}
    steps:
      - name: Receive trusted controller
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.controller.outputs.tool_artifact }}
          path: ${{ runner.temp }}/controller
          merge-multiple: true
      - name: Receive original candidate selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.controller.outputs.selection_artifact }}
          path: ${{ runner.temp }}/selection
          merge-multiple: true
      - name: Acquire public bytes anonymously and verify release attestations
        id: public-identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROLLER_SHA256: ${{ needs.controller.outputs.tool_sha256 }}
          LATEST_POLICY: ${{ inputs.operation == 'resume-public' && inputs.latest || 'required' }}
        run: |
          set -euo pipefail
          controller="$RUNNER_TEMP/controller/lkjscript-release-controller"
          printf '%s  %s\n' "$EXPECTED_CONTROLLER_SHA256" "$controller" | sha256sum --check --strict
          chmod 0555 "$controller"
          "$controller" public-download --selection "$RUNNER_TEMP/selection/selection.json" \
            --latest "$LATEST_POLICY" --output "$RUNNER_TEMP/public-acquisition"
          {
            echo "latest_state=$(jq -er '.latest' "$RUNNER_TEMP/public-acquisition/public-identity.json")"
            echo "latest_tag=$(jq -er '.latest_tag' "$RUNNER_TEMP/public-acquisition/public-identity.json")"
            echo "latest_source=$(jq -er '.latest_source_commit' "$RUNNER_TEMP/public-acquisition/public-identity.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the actual public installed lifecycle
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/selection/selection.json"
          verifier="$RUNNER_TEMP/selection/verifier/lkjscript-dev"
          chmod 0755 "$verifier"
          route=(pair-run --latest-assets "$RUNNER_TEMP/public-acquisition/latest")
          if test ! -d "$RUNNER_TEMP/public-acquisition/latest"; then
            route=(exact-run)
          fi
          env -i PATH="$PATH" HOME="$HOME" LANG=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            "$verifier" release transferred "${route[@]}" \
            --exact-assets "$RUNNER_TEMP/public-acquisition/exact" \
            --tag "$(jq -er '.content.tag' "$selection")" --commit "$(jq -er '.content.source_commit' "$selection")" \
            --acquisition anonymous --evidence-root "$RUNNER_TEMP/public-smoke" \
            --verifier-identity "$RUNNER_TEMP/selection/verifier/verifier-identity.json" \
            --expected-verifier-sha256 "$(jq -er '.content.verifier.sha256' "$selection")" \
            --expected-verifier-bytes "$(jq -er '.content.verifier.byte_length' "$selection")"
      - name: Retain public boundary and exact latest distinction
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-acquisition
            ${{ runner.temp }}/public-smoke
          if-no-files-found: warn
          retention-days: 14

  terminal:
    name: Release terminal decision
    if: always()
    needs: [candidate, controller, publish, public]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every stage selected by this invocation
        env:
          OPERATION: ${{ inputs.operation }}
          CANDIDATE: ${{ needs.candidate.result }}
          CONTROLLER: ${{ needs.controller.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLIC: ${{ needs.public.result }}
          AUTHORITY: ${{ needs.controller.outputs.authority }}
          LATEST_STATE: ${{ needs.public.outputs.latest_state }}
          LATEST_TAG: ${{ needs.public.outputs.latest_tag }}
          LATEST_SOURCE: ${{ needs.public.outputs.latest_source }}
        run: |
          set -euo pipefail
          status=incomplete
          result=1
          case "$OPERATION" in
            candidate)
              if test "$CANDIDATE" = success; then status=candidate_accepted; result=0; fi ;;
            consume)
              if test "$CONTROLLER" = success && { test "$AUTHORITY" = authorized || test "$AUTHORITY" = rejected; }; then
                status=candidate_consumed_read_only; result=0
              fi ;;
            promote|resume-publication)
              if test "$CONTROLLER" = success && test "$AUTHORITY" = authorized && \
                  test "$PUBLISH" = success && test "$PUBLIC" = success; then
                status=immutable_published_and_public_verified; result=0
              fi ;;
            resume-public)
              if test "$CONTROLLER" = success && test "$PUBLIC" = success; then status=public_recheck_passed; result=0; fi ;;
            *) status=rejected ;;
          esac
          jq -n --arg status "$status" --arg operation "$OPERATION" \
            --arg candidate "$CANDIDATE" --arg controller "$CONTROLLER" --arg authority "$AUTHORITY" \
            --arg publication "$PUBLISH" --arg public "$PUBLIC" \
            --arg latest "$LATEST_STATE" --arg latest_tag "$LATEST_TAG" --arg latest_source "$LATEST_SOURCE" \
            '{status:$status,operation:$operation,candidate:$candidate,controller:$controller,promotion_authority:$authority,publication:$publication,public_verification:$public,latest:$latest,latest_tag:$latest_tag,latest_source:$latest_source}' | tee "$RUNNER_TEMP/release-terminal.json"
          exit "$result"
      - name: Retain CI terminal decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-terminal.json
          if-no-files-found: warn
          retention-days: 14
