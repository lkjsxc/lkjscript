name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing exact annotated tag
        required: true
        default: false
        type: boolean
      tag:
        description: Exact vMAJOR.MINOR.PATCH tag; blank derives it from Cargo.toml for a dry run
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"
  RELEASE_CHECKSUMS: SHA256SUMS
  RELEASE_RECEIPT: release-receipt.json
  RELEASE_HANDOFF: release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
  VERIFIER_HANDOFF: verifier-handoff-${{ github.run_id }}-${{ github.run_attempt }}
  VERIFIER_EXECUTABLE: lkjscript-dev
  VERIFIER_IDENTITY: verifier-identity.json
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_ARCHIVE_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  build-verify-package:
    name: Build, verify, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
      publication_mode: ${{ steps.identity.outputs.publication_mode }}
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      release_artifact_id: ${{ steps.release-upload.outputs.artifact-id }}
      release_artifact_digest: ${{ steps.release-upload.outputs.artifact-digest }}
      verifier_artifact_id: ${{ steps.verifier-upload.outputs.artifact-id }}
      verifier_artifact_digest: ${{ steps.verifier-upload.outputs.artifact-digest }}
      verifier_file_bytes: ${{ steps.verifier.outputs.bytes }}
      verifier_file_sha256: ${{ steps.verifier.outputs.sha256 }}
      release_archive: ${{ steps.target.outputs.archive_name }}
      target_triple: ${{ steps.target.outputs.target_triple }}
      target_policy_sha256: ${{ steps.target.outputs.policy_sha256 }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow and release identity
        id: identity
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          product_version=$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$product_version"
          expected_tag="v${product_version}"
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
            test "${GITHUB_REF_TYPE}" = tag
          elif [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            publish=true
            tag="$REQUESTED_TAG"
            test -n "$tag"
          else
            tag="${REQUESTED_TAG:-$expected_tag}"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$tag" = "$expected_tag"
          commit_sha=$(git rev-parse HEAD)
          test "${#commit_sha}" -eq 40
          if [[ "$publish" == "true" ]]; then
            test "$(git cat-file -t "refs/tags/${tag}")" = tag
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$commit_sha"
            git merge-base --is-ancestor HEAD origin/main
            publication_mode=release
          else
            git merge-base --is-ancestor origin/main HEAD
            publication_mode=dry-run
          fi
          {
            echo "publish=$publish"
            echo "publication_mode=$publication_mode"
            echo "tag=$tag"
            echo "commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install the exact repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.98.0
          rustc -Vv
          cargo -V
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - name: Download and verify cargo-about
        id: cargo-about
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-about"
          archive="$RUNNER_TEMP/cargo-about.tar.gz"
          mkdir -p "$tool_root"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_ABOUT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          expected=$(printf '%s\n' \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/LICENSE-APACHE" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/LICENSE-MIT" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/README.md" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/cargo-about")
          observed=$(tar -tzf "$archive")
          test "$observed" = "$expected"
          tar -xzf "$archive" \
            --strip-components=1 \
            --directory "$tool_root" \
            "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/cargo-about"
          chmod 0755 "$tool_root/cargo-about"
          test "$("$tool_root/cargo-about" --version)" = "cargo-about ${CARGO_ABOUT_VERSION}"
          {
            echo "archive=$archive"
            echo "executable=$tool_root/cargo-about"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the exact locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          started=$(date +%s%N)
          cargo fetch --locked
          completed=$(date +%s%N)
          registry_bytes=$(du -sb "$CARGO_HOME/registry" | cut -f1)
          [[ "$registry_bytes" =~ ^[1-9][0-9]*$ ]]
          echo "cargo_registry_bytes=$registry_bytes"
          echo "cargo_fetch_elapsed_nanoseconds=$((completed - started))"

      - name: Build the host verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p lkjscript-dev
          test -f target/release/lkjscript-dev
          test -x target/release/lkjscript-dev

      - name: Resolve the typed target policy and install exact native inputs
        id: target
        shell: bash
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/target-policy-summary.json"
          target/release/lkjscript-dev release target | tee "$summary"
          test "$(wc -l < "$summary")" -eq 1
          jq -e \
            '.status == "passed" and .policy.schema == {identity:"lkjscript-release-target-policy",version:2} and .policy.target_triple == "x86_64-unknown-linux-musl" and .policy.runtime_linkage == "static-musl" and (.policy.userlands | length) == 2 and (.policy.musl_packages | length) == 3' \
            "$summary" > /dev/null
          target_triple=$(jq -er '.policy.target_triple' "$summary")
          archive_name=$(jq -er '.policy.archive_name' "$summary")
          policy_sha256=$(jq -er '.policy_sha256' "$summary")
          [[ "$policy_sha256" =~ ^[0-9a-f]{64}$ ]]
          rustup target add --toolchain 1.98.0 "$target_triple"
          package_root="$RUNNER_TEMP/musl-packages"
          mkdir -m 0700 "$package_root"
          packages=()
          while IFS=$'\t' read -r file_name url sha256; do
            [[ "$file_name" =~ ^musl(-dev|-tools)?_[0-9][0-9A-Za-z.+:~-]*_amd64\.deb$ ]]
            [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
            package="$package_root/$file_name"
            curl --fail --location --silent --show-error --output "$package" "$url"
            printf '%s  %s\n' "$sha256" "$package" | sha256sum --check --strict
            packages+=("$package")
          done < <(jq -r '.policy.musl_packages[] | [.file_name,.url,.sha256] | @tsv' "$summary")
          test "${#packages[@]}" -eq 3
          sudo dpkg --install "${packages[@]}"
          test "$(musl-gcc -dumpmachine)" = x86_64-linux-gnu
          {
            echo "RELEASE_ARCHIVE=$archive_name"
            echo "RELEASE_TARGET=$target_triple"
          } >> "$GITHUB_ENV"
          {
            echo "archive_name=$archive_name"
            echo "target_triple=$target_triple"
            echo "policy_sha256=$policy_sha256"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

      - name: Provision the exact target-admission dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
          started=$(date +%s%N)
          while IFS= read -r image; do
            test -n "$image"
            timeout 10m docker pull --platform linux/amd64 "$image"
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            image_id=$(docker image inspect --format '{{.Id}}' "$image")
            image_bytes=$(docker image inspect --format '{{.Size}}' "$image")
            test "$platform" = linux/amd64
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$image_bytes" =~ ^[1-9][0-9]*$ ]]
            echo "target_prerequisite=$image platform=$platform image_id=$image_id image_bytes=$image_bytes"
          done < <(jq -r '.policy.userlands[].image' "${{ steps.target.outputs.summary }}")
          completed=$(date +%s%N)
          echo "target_prerequisite_pull_elapsed_nanoseconds=$((completed - started))"

      - name: Run fresh full verification
        id: full
        shell: bash
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/full-verification-summary.json"
          set +e
          cargo run --locked -p lkjscript-dev -- check full --machine | tee "$summary"
          check_status=${PIPESTATUS[0]}
          set -e
          test "$(wc -l < "$summary")" -eq 1
          receipt_relative=$(jq -er '.receipt' "$summary")
          [[ "$receipt_relative" == .artifacts/lkjscript-dev/check/*/receipt.json ]]
          [[ ! "$receipt_relative" =~ (^|/)\.\.(/|$) ]]
          receipt="$GITHUB_WORKSPACE/$receipt_relative"
          test -f "$receipt"
          evidence_relative=$(dirname "$receipt_relative")
          evidence_directory=$(dirname "$receipt")
          {
            echo "receipt=$receipt"
            echo "evidence_directory=$evidence_directory"
          } >> "$GITHUB_OUTPUT"
          if [[ "$check_status" -ne 0 ]]; then
            jq '{status, profile, passed_gates, fresh_passed_gates, reused_passed_gates, selected_gates, failure, failed: [.gates[] | select(.status == "failed") | {name, status, reason: .process.reason, exit_code: .process.exit_code, signal: .process.signal, elapsed_nanoseconds, stdout: .process.stdout, stderr: .process.stderr}]}' "$receipt"
            while IFS= read -r log_relative; do
              [[ "$log_relative" == "$evidence_relative/"* ]] || {
                echo "refusing unexpected verification log path: $log_relative" >&2
                exit 1
              }
              log="$GITHUB_WORKSPACE/$log_relative"
              test -f "$log"
              echo "::group::bounded tail of $log_relative"
              tail -c 65536 "$log"
              echo "::endgroup::"
            done < <(jq -r '.gates[] | select(.status == "failed") | (.process.stdout.path // empty), (.process.stderr.path // empty)' "$receipt")
            exit "$check_status"
          fi
          jq -e \
            --arg commit "${{ steps.identity.outputs.commit_sha }}" \
            '.status == "passed" and .profile == "full" and .git_head == $commit and .input_stable == true and .fresh_required == true and .reused_passed_gates == 0' \
            "$receipt"

      - name: Retain bounded full-verification evidence
        if: always() && steps.full.outputs.evidence_directory != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.full.outputs.evidence_directory }}/receipt.json
            ${{ steps.full.outputs.evidence_directory }}/*.log
            ${{ github.workspace }}/.artifacts/lkjscript-dev/service/*/receipt.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/service/*/*.log
            ${{ github.workspace }}/.artifacts/lkjscript-dev/distributed-http/*/receipt.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/distributed-http/*/*.log
            ${{ github.workspace }}/.artifacts/lkjscript-dev/outbound-http/*/receipt.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/outbound-http/*/*.log
            ${{ github.workspace }}/.artifacts/lkjscript-dev/stateful-http/*/receipt.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/stateful-http/*/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

      - name: Build and admit the exact static candidate
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/target-admission"
          mkdir -m 0700 "$root"
          candidate="$root/lkjscript"
          build_receipt="$root/build-receipt.json"
          target/release/lkjscript-dev release build \
            --output "$candidate" \
            --receipt "$build_receipt" | tee "$root/build-summary.json"
          evidence="$root/acceptance"
          target/release/lkjscript-dev release admit \
            --candidate "$candidate" \
            --build-receipt "$build_receipt" \
            --evidence-root "$evidence" | tee "$root/admission-summary.json"
          test "$(wc -l < "$root/build-summary.json")" -eq 1
          test "$(wc -l < "$root/admission-summary.json")" -eq 1
          candidate_sha=$(sha256sum "$candidate" | cut -d' ' -f1)
          jq -e \
            --arg commit "${{ steps.identity.outputs.commit_sha }}" \
            --arg target "${{ steps.target.outputs.target_triple }}" \
            --arg policy "${{ steps.target.outputs.policy_sha256 }}" \
            --arg candidate_sha "$candidate_sha" \
            '.status == "passed" and .source_commit == $commit and .target_triple == $target and .runtime_linkage == "static-musl" and .target_policy_sha256 == $policy and .candidate_sha256 == $candidate_sha and .userlands == 2 and .oracles == 4 and .cleanup_complete == true' \
            "$root/admission-summary.json" > /dev/null
          receipt=$(jq -er '.receipt' "$root/admission-summary.json")
          test "$receipt" = "$evidence/receipt.json"
          test "$(sha256sum "$receipt" | cut -d' ' -f1)" = \
            "$(jq -er '.receipt_sha256' "$root/admission-summary.json")"
          {
            echo "candidate=$candidate"
            echo "build_receipt=$build_receipt"
            echo "receipt=$receipt"
            echo "evidence=$root"
          } >> "$GITHUB_OUTPUT"

      - name: Retain bounded target-admission evidence
        if: always() && steps.admission.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-admission-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.admission.outputs.evidence }}/build-receipt.json
            ${{ steps.admission.outputs.evidence }}/build-receipt.cargo.stdout.log
            ${{ steps.admission.outputs.evidence }}/build-receipt.cargo.stderr.log
            ${{ steps.admission.outputs.evidence }}/build-summary.json
            ${{ steps.admission.outputs.evidence }}/admission-summary.json
            ${{ steps.admission.outputs.evidence }}/acceptance/receipt.json
            ${{ steps.admission.outputs.evidence }}/acceptance/*.log
            ${{ steps.admission.outputs.evidence }}/acceptance/distributed-http/receipt.json
            ${{ steps.admission.outputs.evidence }}/acceptance/distributed-http/*.log
            ${{ steps.admission.outputs.evidence }}/acceptance/outbound-http/receipt.json
            ${{ steps.admission.outputs.evidence }}/acceptance/outbound-http/*.log
            ${{ steps.admission.outputs.evidence }}/acceptance/stateful-http/receipt.json
            ${{ steps.admission.outputs.evidence }}/acceptance/stateful-http/*.log
            ${{ github.workspace }}/.artifacts/lkjscript-dev/service/*/receipt.json
            ${{ github.workspace }}/.artifacts/lkjscript-dev/service/*/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

      - name: Prepare and strictly verify the release handoff
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release-output"
          target/release/lkjscript-dev release prepare \
            --candidate "${{ steps.admission.outputs.candidate }}" \
            --cargo-about "${{ steps.cargo-about.outputs.executable }}" \
            --cargo-about-archive "${{ steps.cargo-about.outputs.archive }}" \
            --output "$output" \
            --tag "${{ steps.identity.outputs.tag }}" \
            --publication "${{ steps.identity.outputs.publication_mode }}" \
            --full-verification-receipt "${{ steps.full.outputs.receipt }}" \
            --target-admission-receipt "${{ steps.admission.outputs.receipt }}" \
            --require-full-verification | tee "$RUNNER_TEMP/release-prepare-summary.json"
          target/release/lkjscript-dev release verify \
            --archive "$output/$RELEASE_ARCHIVE" \
            --checksums "$output/$RELEASE_CHECKSUMS" \
            --receipt "$output/$RELEASE_RECEIPT" \
            --expected-tag "${{ steps.identity.outputs.tag }}" \
            --expected-publication "${{ steps.identity.outputs.publication_mode }}"
          (cd "$output" && sha256sum --check --strict "$RELEASE_CHECKSUMS")
          test "$(find "$output" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "$output" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Prepare the transferable application verifier handoff
        id: verifier
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/verifier-handoff"
          target/release/lkjscript-dev release verifier prepare \
            --executable "$GITHUB_WORKSPACE/target/release/lkjscript-dev" \
            --output "$handoff" \
            --tag "$TAG" \
            --commit "$COMMIT_SHA" | tee "$RUNNER_TEMP/verifier-prepare-summary.json"
          test "$(wc -l < "$RUNNER_TEMP/verifier-prepare-summary.json")" -eq 1
          bytes=$(jq -er '.bytes' "$RUNNER_TEMP/verifier-prepare-summary.json")
          sha256=$(jq -er '.sha256' "$RUNNER_TEMP/verifier-prepare-summary.json")
          test "$(jq -er '.directory' "$RUNNER_TEMP/verifier-prepare-summary.json")" = "$handoff"
          test "$(jq -er '.schema.identity' "$RUNNER_TEMP/verifier-prepare-summary.json")" = \
            lkjscript-application-verifier-handoff
          {
            echo "directory=$handoff"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the transient verified release handoff
        id: release-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_HANDOFF }}
          path: ${{ steps.prepare.outputs.output }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload the transient application verifier handoff
        id: verifier-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.VERIFIER_HANDOFF }}
          path: ${{ steps.verifier.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  pre-publication-applications:
    name: Verify transferred packaged application candidate
    needs: build-verify-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_ARCHIVE: ${{ needs.build-verify-package.outputs.release_archive }}
    outputs:
      evidence_artifact_id: ${{ steps.evidence-upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.evidence-upload.outputs.artifact-digest }}
      distributed_receipt_digest: ${{ steps.acceptance.outputs.distributed_receipt_digest }}
      distributed_receipt_sha256: ${{ steps.acceptance.outputs.distributed_receipt_sha256 }}
      stateful_receipt_digest: ${{ steps.acceptance.outputs.stateful_receipt_digest }}
      stateful_receipt_sha256: ${{ steps.acceptance.outputs.stateful_receipt_sha256 }}
    steps:
      - name: Download the exact release handoff by artifact identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-verify-package.outputs.release_artifact_id }}
          path: ${{ runner.temp }}/release-handoff
          merge-multiple: true

      - name: Download the exact verifier handoff by artifact identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-verify-package.outputs.verifier_artifact_id }}
          path: ${{ runner.temp }}/verifier-handoff
          merge-multiple: true

      - name: Validate transferred inventories, artifact identities, and verifier bytes
        id: transferred
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
          RELEASE_ARTIFACT_ID: ${{ needs.build-verify-package.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build-verify-package.outputs.release_artifact_digest }}
          VERIFIER_ARTIFACT_ID: ${{ needs.build-verify-package.outputs.verifier_artifact_id }}
          VERIFIER_ARTIFACT_DIGEST: ${{ needs.build-verify-package.outputs.verifier_artifact_digest }}
          VERIFIER_FILE_BYTES: ${{ needs.build-verify-package.outputs.verifier_file_bytes }}
          VERIFIER_FILE_SHA256: ${{ needs.build-verify-package.outputs.verifier_file_sha256 }}
        run: |
          set -euo pipefail
          validate_artifact() {
            local id=$1
            local expected_name=$2
            local expected_digest=$3
            local metadata="$RUNNER_TEMP/artifact-$id.json"
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            if [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then
              expected_digest="sha256:$expected_digest"
            fi
            [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$metadata"
            jq -e \
              --argjson id "$id" \
              --arg name "$expected_name" \
              --arg digest "$expected_digest" \
              --argjson run_id "$GITHUB_RUN_ID" \
              '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id and .size_in_bytes > 0' \
              "$metadata" > /dev/null
            jq -r '.size_in_bytes' "$metadata"
          }
          release_artifact_bytes=$(validate_artifact "$RELEASE_ARTIFACT_ID" "$RELEASE_HANDOFF" "$RELEASE_ARTIFACT_DIGEST")
          verifier_artifact_bytes=$(validate_artifact "$VERIFIER_ARTIFACT_ID" "$VERIFIER_HANDOFF" "$VERIFIER_ARTIFACT_DIGEST")

          release="$RUNNER_TEMP/release-handoff"
          expected_release=$(printf '%s\n' "$RELEASE_ARCHIVE" "$RELEASE_CHECKSUMS" "$RELEASE_RECEIPT" | sort)
          observed_release=$(find "$release" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$observed_release" = "$expected_release"
          test "$(find "$release" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (cd "$release" && sha256sum --check --strict "$RELEASE_CHECKSUMS")

          handoff="$RUNNER_TEMP/verifier-handoff"
          expected_verifier=$(printf '%s\n' "$VERIFIER_EXECUTABLE" "$VERIFIER_IDENTITY" | sort)
          observed_verifier=$(find "$handoff" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$observed_verifier" = "$expected_verifier"
          test "$(find "$handoff" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          identity="$handoff/$VERIFIER_IDENTITY"
          verifier="$handoff/$VERIFIER_EXECUTABLE"
          test -f "$verifier"
          test ! -L "$verifier"
          observed_bytes=$(stat -c '%s' "$verifier")
          transport_mode=$(stat -c '%a' "$verifier")
          observed_sha=$(sha256sum "$verifier" | cut -d' ' -f1)
          test "$observed_bytes" = "$VERIFIER_FILE_BYTES"
          test "$observed_sha" = "$VERIFIER_FILE_SHA256"
          case "$transport_mode" in
            755) ;;
            644|600) chmod 0755 "$verifier" ;;
            *) echo "unexpected verifier transport mode: $transport_mode" >&2; exit 1 ;;
          esac
          test -x "$verifier"
          test "$(stat -c '%s' "$verifier")" = "$VERIFIER_FILE_BYTES"
          test "$(sha256sum "$verifier" | cut -d' ' -f1)" = "$VERIFIER_FILE_SHA256"
          "$verifier" release verifier verify \
            --executable "$verifier" \
            --identity "$identity" \
            --tag "$TAG" \
            --commit "$COMMIT_SHA" \
            --expected-sha256 "$VERIFIER_FILE_SHA256" \
            --expected-bytes "$VERIFIER_FILE_BYTES" | tee "$RUNNER_TEMP/verifier-verify-summary.json"
          test "$(wc -l < "$RUNNER_TEMP/verifier-verify-summary.json")" -eq 1
          {
            echo "release=$release"
            echo "verifier=$verifier"
            echo "transport_mode=$transport_mode"
            echo "release_artifact_bytes=$release_artifact_bytes"
            echo "verifier_artifact_bytes=$verifier_artifact_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: First-party verify, extract, and run packaged application acceptance
        id: acceptance
        shell: bash
        env:
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
          PUBLICATION_MODE: ${{ needs.build-verify-package.outputs.publication_mode }}
          RELEASE: ${{ steps.transferred.outputs.release }}
          VERIFIER: ${{ steps.transferred.outputs.verifier }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prepublication"
          test ! -e "$root"
          mkdir -m 0700 "$root"
          extraction="$root/extracted"
          release_summary="$root/release-verify-summary.json"
          env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" release verify \
            --archive "$RELEASE/$RELEASE_ARCHIVE" \
            --checksums "$RELEASE/$RELEASE_CHECKSUMS" \
            --receipt "$RELEASE/$RELEASE_RECEIPT" \
            --extract-to "$extraction" \
            --expected-tag "$TAG" \
            --expected-publication "$PUBLICATION_MODE" | tee "$release_summary"
          test "$(wc -l < "$release_summary")" -eq 1
          manifest="$extraction/RELEASE-MANIFEST.json"
          candidate="$extraction/lkjscript"
          test -f "$manifest"
          test -x "$candidate"
          candidate_sha=$(sha256sum "$candidate" | cut -d' ' -f1)
          candidate_bytes=$(stat -c '%s' "$candidate")
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$COMMIT_SHA" \
            --arg mode "$PUBLICATION_MODE" \
            --arg extraction "$extraction" \
            --arg sha "$candidate_sha" \
            --argjson bytes "$candidate_bytes" \
            '.status == "passed" and .tag == $tag and .commit_sha == $commit and .publication_mode == $mode and .extraction == $extraction and .executable_sha256 == $sha and .executable_bytes == $bytes' \
            "$release_summary" > /dev/null

          distributed_evidence="$root/distributed-http"
          distributed_summary="$root/distributed-http-summary.json"
          env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" distributed-http \
            --binary "$candidate" \
            --evidence-root "$distributed_evidence" \
            --machine | tee "$distributed_summary"
          test "$(wc -l < "$distributed_summary")" -eq 1
          distributed_receipt=$(jq -er '.receipt' "$distributed_summary")
          test "$distributed_receipt" = "$distributed_evidence/receipt.json"
          test -f "$distributed_receipt"
          distributed_receipt_sha256=$(sha256sum "$distributed_receipt" | cut -d' ' -f1)
          test "$distributed_receipt_sha256" = "$(jq -er '.receipt_sha256' "$distributed_summary")"
          distributed_receipt_digest=$(jq -er '.receipt_digest' "$distributed_summary")
          manifest_capabilities=$(jq -er '.executable.capabilities_digest' "$manifest")
          manifest_version=$(jq -er '.product.version' "$manifest")
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            --arg version "$manifest_version" \
            --arg capabilities "$manifest_capabilities" \
            '.schema == {identity:"lkjscript-distributed-http-acceptance",version:2} and .workflow == "distributed-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.product_version == $version and .result.capabilities_digest == $capabilities and .result.authority_unchanged == true and .result.clean_incremental_equal == true and .result.restart_equal == true and .result.startup_failures_without_ready == 6 and .cleanup.runner_cleanup_complete == true and .cleanup.isolated_root_removed == true' \
            "$distributed_receipt" > /dev/null

          outbound_evidence="$root/outbound-http"
          outbound_summary="$root/outbound-http-summary.json"
          env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" outbound-http \
            --binary "$candidate" \
            --evidence-root "$outbound_evidence" \
            --machine | tee "$outbound_summary"
          test "$(wc -l < "$outbound_summary")" -eq 1
          outbound_receipt=$(jq -er '.receipt' "$outbound_summary")
          test "$outbound_receipt" = "$outbound_evidence/receipt.json"
          test -f "$outbound_receipt"
          outbound_receipt_sha256=$(sha256sum "$outbound_receipt" | cut -d' ' -f1)
          test "$outbound_receipt_sha256" = "$(jq -er '.receipt_sha256' "$outbound_summary")"
          outbound_receipt_digest=$(jq -er '.receipt_digest' "$outbound_summary")
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            --arg version "$manifest_version" \
            --arg capabilities "$manifest_capabilities" \
            '.schema == {identity:"lkjscript-outbound-http-acceptance",version:1} and .workflow == "outbound-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.product_version == $version and .result.capabilities_digest == $capabilities and .result.authority_unchanged == true and .result.clean_incremental_equal == true and .result.restart_equal == true and .result.startup_failures_without_ready == 1 and (.result.responses | length) == 17 and (.result.no_connection | length) == 1 and .result.certificate.generator == "lkjscript-deterministic-ed25519-tls-fixture-1" and .cleanup.runner_cleanup_complete == true and .cleanup.oracle_cleanup_complete == true and .cleanup.isolated_root_removed == true and .cleanup.raw_secret_values_retained == false' \
            "$outbound_receipt" > /dev/null

          stateful_evidence="$root/stateful-http"
          stateful_summary="$root/stateful-http-summary.json"
          env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" stateful-http \
            --binary "$candidate" \
            --evidence-root "$stateful_evidence" \
            --machine | tee "$stateful_summary"
          test "$(wc -l < "$stateful_summary")" -eq 1
          stateful_receipt=$(jq -er '.receipt' "$stateful_summary")
          test "$stateful_receipt" = "$stateful_evidence/receipt.json"
          test -f "$stateful_receipt"
          stateful_receipt_sha256=$(sha256sum "$stateful_receipt" | cut -d' ' -f1)
          test "$stateful_receipt_sha256" = "$(jq -er '.receipt_sha256' "$stateful_summary")"
          stateful_receipt_digest=$(jq -er '.receipt_digest' "$stateful_summary")
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            '.schema == {identity:"lkjscript-stateful-http-acceptance",version:4} and .workflow == "stateful-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.workflow == "stateful-http-application" and .result.initial_template == "minimal" and .result.initial_owners == 0 and .result.initial_dependencies == 0 and .result.dependency_staged == true and .result.topology.target_name == "serve" and .result.topology.runner == "http" and (.result.topology.requirements | keys) == ["clock","data","identifiers","streams"] and .result.idempotent_reconciliation == true and .result.deterministic == true and .result.incremental_sha256 == .result.clean_sha256 and .result.live.data_contract == "lkjscript-data-store-1" and .result.live.persistence_after_restart == true and .result.live.backup_restore_equivalent == true and .result.live.absent_root_no_ready == true and .result.live.corrupt_root_no_ready == true and .result.live.malformed_request_contained == true and .result.live.startup_failures_without_ready == 2 and .result.live.runner_starts == 3 and .result.live.shutdown_cleanup_failures == 0 and .result.live.temporary_data_cleanup_complete == true and .result.live.authority_unchanged == true and .cleanup.temporary_root_removed == true and .cleanup.data_cleanup_complete == true and .cleanup.runner_cleanup_complete == true and .cleanup.raw_secret_values_retained == false' \
            "$stateful_receipt" > /dev/null
          {
            echo "distributed_receipt=$distributed_receipt"
            echo "distributed_receipt_digest=$distributed_receipt_digest"
            echo "distributed_receipt_sha256=$distributed_receipt_sha256"
            echo "outbound_receipt=$outbound_receipt"
            echo "outbound_receipt_digest=$outbound_receipt_digest"
            echo "outbound_receipt_sha256=$outbound_receipt_sha256"
            echo "stateful_receipt=$stateful_receipt"
            echo "stateful_receipt_digest=$stateful_receipt_digest"
            echo "stateful_receipt_sha256=$stateful_receipt_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Retain bounded pre-publication application evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-publication-application-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prepublication/release-verify-summary.json
            ${{ runner.temp }}/prepublication/distributed-http-summary.json
            ${{ runner.temp }}/prepublication/outbound-http-summary.json
            ${{ runner.temp }}/prepublication/stateful-http-summary.json
            ${{ runner.temp }}/prepublication/extracted/RELEASE-MANIFEST.json
            ${{ runner.temp }}/prepublication/distributed-http/receipt.json
            ${{ runner.temp }}/prepublication/distributed-http/*.log
            ${{ runner.temp }}/prepublication/outbound-http/receipt.json
            ${{ runner.temp }}/prepublication/outbound-http/*.log
            ${{ runner.temp }}/prepublication/stateful-http/receipt.json
            ${{ runner.temp }}/prepublication/stateful-http/*.log
            ${{ runner.temp }}/verifier-handoff/verifier-identity.json
            ${{ runner.temp }}/verifier-verify-summary.json
            ${{ runner.temp }}/artifact-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  publish:
    name: Publish immutable release
    if: needs.build-verify-package.outputs.publish == 'true'
    needs:
      - build-verify-package
      - pre-publication-applications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_ARCHIVE: ${{ needs.build-verify-package.outputs.release_archive }}
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      immutable: ${{ steps.publish.outputs.immutable }}
    steps:
      - name: Download the verified handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_HANDOFF }}
          path: ${{ runner.temp }}/release-handoff

      - name: Validate handoff without executing repository code
        id: handoff
        shell: bash
        env:
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/release-handoff"
          expected=$(printf '%s\n' "$RELEASE_ARCHIVE" "$RELEASE_CHECKSUMS" "$RELEASE_RECEIPT" | sort)
          observed=$(find "$handoff" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$observed" = "$expected"
          test "$(find "$handoff" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (cd "$handoff" && sha256sum --check --strict "$RELEASE_CHECKSUMS")
          archive_sha=$(sha256sum "$handoff/$RELEASE_ARCHIVE" | cut -d' ' -f1)
          archive_bytes=$(stat -c '%s' "$handoff/$RELEASE_ARCHIVE")
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$COMMIT_SHA" \
            --arg archive "$RELEASE_ARCHIVE" \
            --arg sha "$archive_sha" \
            --argjson bytes "$archive_bytes" \
            '.publication_mode == "release" and .release_tag == $tag and .commit_sha == $commit and .archive.name == $archive and .archive.sha256 == $sha and .archive.byte_length == $bytes and (.classifications | all(.classification == "fresh_passed"))' \
            "$handoff/$RELEASE_RECEIPT"
          tar -xOzf "$handoff/$RELEASE_ARCHIVE" lkjscript/RELEASE-MANIFEST.json > "$RUNNER_TEMP/RELEASE-MANIFEST.json"
          manifest_sha=$(sha256sum "$RUNNER_TEMP/RELEASE-MANIFEST.json" | cut -d' ' -f1)
          test "$manifest_sha" = "$(jq -er '.manifest_sha256' "$handoff/$RELEASE_RECEIPT")"
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$COMMIT_SHA" \
            '.publication_mode == "release" and .source.expected_release_tag == $tag and .source.tagged_commit_sha == $commit' \
            "$RUNNER_TEMP/RELEASE-MANIFEST.json"
          {
            echo "directory=$handoff"
            echo "archive_sha=$archive_sha"
            echo "archive_bytes=$archive_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: Create, verify, and publish the draft
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
          HANDOFF: ${{ steps.handoff.outputs.directory }}
          ARCHIVE_SHA: ${{ steps.handoff.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.handoff.outputs.archive_bytes }}
          IMMUTABLE_RELEASE_TAG_OBJECT_SHA: ${{ vars.LKJSCRIPT_IMMUTABLE_RELEASE_TAG_OBJECT_SHA }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          test "$(jq -r '.object.type' <<< "$ref")" = tag
          tag_object_sha=$(jq -r '.object.sha' <<< "$ref")
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.object.type' <<< "$tag_object")" = commit
          test "$(jq -r '.object.sha' <<< "$tag_object")" = "$COMMIT_SHA"
          test "$(jq -r '.source.annotated_tag_object_sha' "$RUNNER_TEMP/RELEASE-MANIFEST.json")" = "$tag_object_sha"
          test -n "$IMMUTABLE_RELEASE_TAG_OBJECT_SHA"
          test "$IMMUTABLE_RELEASE_TAG_OBJECT_SHA" = "$tag_object_sha"
          release_notes="$RUNNER_TEMP/release-notes.txt"
          jq -er '.message' <<< "$tag_object" > "$release_notes"
          test -s "$release_notes"

          release_file="$RUNNER_TEMP/release.json"
          load_release() {
            local releases_file="$RUNNER_TEMP/releases.json"
            local overflow_file="$RUNNER_TEMP/releases-overflow.json"
            local release_count
            local matches
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=1" > "$releases_file"
            release_count=$(jq -er 'length' "$releases_file")
            [[ "$release_count" =~ ^[0-9]+$ ]]
            if [[ "$release_count" -eq 100 ]]; then
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=2" > "$overflow_file"
              test "$(jq -er 'length' "$overflow_file")" -eq 0
            fi
            matches=$(jq -er --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")
            test "$matches" -le 1
            release_found=false
            if [[ "$matches" -eq 1 ]]; then
              jq -e --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | .[0]' \
                "$releases_file" > "$release_file"
              release_found=true
            else
              printf '{}\n' > "$release_file"
            fi
          }
          wait_for_release() {
            for attempt in $(seq 1 12); do
              load_release
              if [[ "$release_found" == "true" ]]; then
                echo "release discovery attempts=$attempt"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                echo "release discovery pending attempt=$attempt; retrying in 5 seconds" >&2
                sleep 5
              fi
            done
            return 1
          }
          load_release
          existing=$release_found
          if [[ "$existing" == "false" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$TAG" \
              --notes-file "$release_notes"
            wait_for_release
          fi

          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .name == $tag and .prerelease == false' \
            "$release_file"
          draft=$(jq -r '.draft' "$release_file")
          if [[ "$draft" == "false" ]]; then
            test "$(jq -r '.immutable' "$release_file")" = true
          fi

          checksum_sha=$(sha256sum "$HANDOFF/$RELEASE_CHECKSUMS" | cut -d' ' -f1)
          checksum_bytes=$(stat -c '%s' "$HANDOFF/$RELEASE_CHECKSUMS")
          asset_names=$(jq -r '.assets[].name' "$release_file" | sort)
          if [[ -n "$asset_names" ]]; then
            while IFS= read -r name; do
              [[ "$name" == "$RELEASE_ARCHIVE" || "$name" == "$RELEASE_CHECKSUMS" ]]
            done <<< "$asset_names"
          fi

          upload_missing() {
            local name=$1
            if ! jq -e --arg name "$name" '.assets[] | select(.name == $name)' "$release_file" > /dev/null; then
              local release_id
              local upload_bytes
              local upload_response
              test "$draft" = true
              release_id=$(jq -er '.id' "$release_file")
              [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
              upload_bytes=$(stat -c '%s' "$HANDOFF/$name")
              [[ "$upload_bytes" =~ ^[1-9][0-9]*$ ]]
              upload_response="$RUNNER_TEMP/upload-$name.json"
              curl --fail --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header 'Content-Type: application/octet-stream' \
                --data-binary "@$HANDOFF/$name" \
                --output "$upload_response" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name"
              jq -e --arg name "$name" --argjson bytes "$upload_bytes" \
                '.name == $name and .state == "uploaded" and .size == $bytes' \
                "$upload_response" > /dev/null
              wait_for_release
            fi
          }
          upload_missing "$RELEASE_ARCHIVE"
          upload_missing "$RELEASE_CHECKSUMS"

          verify_assets() {
            jq -e \
              --arg archive "$RELEASE_ARCHIVE" \
              --arg archive_digest "sha256:$ARCHIVE_SHA" \
              --argjson archive_bytes "$ARCHIVE_BYTES" \
              --arg checksums "$RELEASE_CHECKSUMS" \
              --arg checksum_digest "sha256:$checksum_sha" \
              --argjson checksum_bytes "$checksum_bytes" \
              '(.assets | length) == 2 and
               any(.assets[]; .name == $archive and .digest == $archive_digest and .size == $archive_bytes) and
               any(.assets[]; .name == $checksums and .digest == $checksum_digest and .size == $checksum_bytes)' \
              "$release_file" > /dev/null
          }
          verified=false
          for attempt in $(seq 1 12); do
            load_release
            if [[ "$release_found" == "true" ]] && verify_assets; then
              verified=true
              echo "asset digest propagation attempts=$attempt"
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          test "$verified" = true

          if [[ "$draft" == "true" ]]; then
            release_id=$(jq -r '.id' "$release_file")
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true > "$release_file"
          fi

          immutable=false
          for attempt in $(seq 1 12); do
            load_release
            if [[ "$release_found" == "true" ]] && \
               [[ "$(jq -r '.draft' "$release_file")" == "false" ]] && \
               [[ "$(jq -r '.immutable' "$release_file")" == "true" ]]; then
              immutable=true
              echo "immutable propagation attempts=$attempt"
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          test "$immutable" = true
          verify_assets
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
          {
            echo "release_url=$(jq -r '.html_url' "$release_file")"
            echo "immutable=true"
          } >> "$GITHUB_OUTPUT"

  post-release:
    name: Verify anonymous public release
    if: needs.build-verify-package.outputs.publish == 'true'
    needs:
      - build-verify-package
      - pre-publication-applications
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      RELEASE_ARCHIVE: ${{ needs.build-verify-package.outputs.release_archive }}
    outputs:
      evidence_artifact_id: ${{ steps.evidence-upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.evidence-upload.outputs.artifact-digest }}
    steps:
      - name: Download the exact verifier handoff by artifact identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-verify-package.outputs.verifier_artifact_id }}
          path: ${{ runner.temp }}/verifier-handoff
          merge-multiple: true

      - name: Validate public-verification artifact and verifier identities
        id: verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
          VERIFIER_ARTIFACT_ID: ${{ needs.build-verify-package.outputs.verifier_artifact_id }}
          VERIFIER_ARTIFACT_DIGEST: ${{ needs.build-verify-package.outputs.verifier_artifact_digest }}
          VERIFIER_FILE_BYTES: ${{ needs.build-verify-package.outputs.verifier_file_bytes }}
          VERIFIER_FILE_SHA256: ${{ needs.build-verify-package.outputs.verifier_file_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERIFIER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          expected_artifact_digest="$VERIFIER_ARTIFACT_DIGEST"
          if [[ "$expected_artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
            expected_artifact_digest="sha256:$expected_artifact_digest"
          fi
          [[ "$expected_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact_metadata="$RUNNER_TEMP/verifier-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIER_ARTIFACT_ID" > "$artifact_metadata"
          jq -e \
            --argjson id "$VERIFIER_ARTIFACT_ID" \
            --arg name "$VERIFIER_HANDOFF" \
            --arg digest "$expected_artifact_digest" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id and .size_in_bytes > 0' \
            "$artifact_metadata" > /dev/null

          handoff="$RUNNER_TEMP/verifier-handoff"
          expected=$(printf '%s\n' "$VERIFIER_EXECUTABLE" "$VERIFIER_IDENTITY" | sort)
          observed=$(find "$handoff" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$observed" = "$expected"
          test "$(find "$handoff" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          identity="$handoff/$VERIFIER_IDENTITY"
          verifier="$handoff/$VERIFIER_EXECUTABLE"
          test -f "$verifier"
          test ! -L "$verifier"
          observed_bytes=$(stat -c '%s' "$verifier")
          transport_mode=$(stat -c '%a' "$verifier")
          observed_sha=$(sha256sum "$verifier" | cut -d' ' -f1)
          test "$observed_bytes" = "$VERIFIER_FILE_BYTES"
          test "$observed_sha" = "$VERIFIER_FILE_SHA256"
          case "$transport_mode" in
            755) ;;
            644|600) chmod 0755 "$verifier" ;;
            *) echo "unexpected verifier transport mode: $transport_mode" >&2; exit 1 ;;
          esac
          test -x "$verifier"
          test "$(stat -c '%s' "$verifier")" = "$VERIFIER_FILE_BYTES"
          test "$(sha256sum "$verifier" | cut -d' ' -f1)" = "$VERIFIER_FILE_SHA256"
          "$verifier" release verifier verify \
            --executable "$verifier" \
            --identity "$identity" \
            --tag "$TAG" \
            --commit "$COMMIT_SHA" \
            --expected-sha256 "$VERIFIER_FILE_SHA256" \
            --expected-bytes "$VERIFIER_FILE_BYTES" | tee "$RUNNER_TEMP/verifier-verify-summary.json"
          test "$(wc -l < "$RUNNER_TEMP/verifier-verify-summary.json")" -eq 1
          {
            echo "path=$verifier"
            echo "transport_mode=$transport_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact and latest assets anonymously
        id: download
        shell: bash
        env:
          TAG: ${{ needs.build-verify-package.outputs.tag }}
        run: |
          set -euo pipefail
          exact="$RUNNER_TEMP/exact"
          latest="$RUNNER_TEMP/latest"
          mkdir -p "$exact" "$latest"
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          download_public_asset() {
            local url=$1
            local destination=$2
            for attempt in $(seq 1 12); do
              if env -u GH_TOKEN -u GITHUB_TOKEN curl \
                --fail --location --silent --show-error \
                --output "$destination.part" "$url"; then
                mv "$destination.part" "$destination"
                echo "anonymous download propagation attempts=$attempt url=$url"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 5
              fi
            done
            return 1
          }
          download_public_asset \
            "$base/download/$TAG/$RELEASE_ARCHIVE" "$exact/$RELEASE_ARCHIVE"
          download_public_asset \
            "$base/download/$TAG/$RELEASE_CHECKSUMS" "$exact/$RELEASE_CHECKSUMS"
          download_public_asset \
            "$base/latest/download/$RELEASE_ARCHIVE" "$latest/$RELEASE_ARCHIVE"
          download_public_asset \
            "$base/latest/download/$RELEASE_CHECKSUMS" "$latest/$RELEASE_CHECKSUMS"
          (cd "$exact" && sha256sum --check --strict "$RELEASE_CHECKSUMS")
          (cd "$latest" && sha256sum --check --strict "$RELEASE_CHECKSUMS")
          cmp "$exact/$RELEASE_ARCHIVE" "$latest/$RELEASE_ARCHIVE"
          cmp "$exact/$RELEASE_CHECKSUMS" "$latest/$RELEASE_CHECKSUMS"
          archive_sha=$(sha256sum "$exact/$RELEASE_ARCHIVE" | cut -d' ' -f1)
          checksum_sha=$(sha256sum "$exact/$RELEASE_CHECKSUMS" | cut -d' ' -f1)
          archive_bytes=$(stat -c '%s' "$exact/$RELEASE_ARCHIVE")
          checksum_bytes=$(stat -c '%s' "$exact/$RELEASE_CHECKSUMS")
          {
            echo "archive_sha256=$archive_sha"
            echo "checksum_sha256=$checksum_sha"
            echo "archive_bytes=$archive_bytes"
            echo "checksum_bytes=$checksum_bytes"
            echo "exact=$exact"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify GitHub asset digests and release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          EXACT: ${{ steps.download.outputs.exact }}
          ARCHIVE_SHA: ${{ steps.download.outputs.archive_sha256 }}
          CHECKSUM_SHA: ${{ steps.download.outputs.checksum_sha256 }}
          ARCHIVE_BYTES: ${{ steps.download.outputs.archive_bytes }}
          CHECKSUM_BYTES: ${{ steps.download.outputs.checksum_bytes }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$(jq -r '.immutable' <<< "$release")" = true
          test "$(jq -r '.draft' <<< "$release")" = false
          test "$(jq -r '.prerelease' <<< "$release")" = false
          test "$(jq -r '.name' <<< "$release")" = "$TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
          jq -e \
            --arg archive "$RELEASE_ARCHIVE" \
            --arg archive_digest "sha256:$ARCHIVE_SHA" \
            --argjson archive_bytes "$ARCHIVE_BYTES" \
            --arg checksums "$RELEASE_CHECKSUMS" \
            --arg checksum_digest "sha256:$CHECKSUM_SHA" \
            --argjson checksum_bytes "$CHECKSUM_BYTES" \
            '(.assets | length) == 2 and any(.assets[]; .name == $archive and .digest == $archive_digest and .size == $archive_bytes) and any(.assets[]; .name == $checksums and .digest == $checksum_digest and .size == $checksum_bytes)' \
            <<< "$release" > /dev/null

          attestation=false
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" --format json > "$RUNNER_TEMP/release-attestation.json" 2> "$RUNNER_TEMP/release-attestation.stderr"; then
              attestation=true
              echo "release attestation propagation attempts=$attempt"
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          if [[ "$attestation" != "true" ]]; then
            cat "$RUNNER_TEMP/release-attestation.stderr" >&2
            exit 1
          fi
          verify_asset_attestation() {
            local asset=$1
            local output=$2
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" --format json > "$output" 2> "$output.stderr"; then
                echo "asset attestation propagation attempts=$attempt asset=$(basename "$asset")"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 5
              fi
            done
            cat "$output.stderr" >&2
            return 1
          }
          verify_asset_attestation \
            "$EXACT/$RELEASE_ARCHIVE" "$RUNNER_TEMP/archive-attestation.json"
          verify_asset_attestation \
            "$EXACT/$RELEASE_CHECKSUMS" "$RUNNER_TEMP/checksum-attestation.json"

      - name: Independently verify and exercise exact and latest application binaries
        id: acceptance
        shell: bash
        env:
          TAG: ${{ needs.build-verify-package.outputs.tag }}
          COMMIT_SHA: ${{ needs.build-verify-package.outputs.commit_sha }}
          EXACT: ${{ steps.download.outputs.exact }}
          LATEST: ${{ steps.download.outputs.latest }}
          VERIFIER: ${{ steps.verifier.outputs.path }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-verification"
          test ! -e "$root"
          mkdir -m 0700 "$root"

          verify_public_application() {
            local label=$1
            local asset_root=$2
            local extraction="$root/$label-extracted"
            local release_summary="$root/$label-release-summary.json"
            local distributed_evidence="$root/$label-distributed-http"
            local distributed_summary="$root/$label-distributed-http-summary.json"
            local outbound_evidence="$root/$label-outbound-http"
            local outbound_summary="$root/$label-outbound-http-summary.json"
            local stateful_evidence="$root/$label-stateful-http"
            local stateful_summary="$root/$label-stateful-http-summary.json"
            env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" release verify \
              --archive "$asset_root/$RELEASE_ARCHIVE" \
              --checksums "$asset_root/$RELEASE_CHECKSUMS" \
              --extract-to "$extraction" \
              --expected-tag "$TAG" \
              --expected-publication release | tee "$release_summary"
            test "$(wc -l < "$release_summary")" -eq 1
            local manifest="$extraction/RELEASE-MANIFEST.json"
            local candidate="$extraction/lkjscript"
            test -f "$manifest"
            test -x "$candidate"
            local candidate_sha
            local candidate_bytes
            candidate_sha=$(sha256sum "$candidate" | cut -d' ' -f1)
            candidate_bytes=$(stat -c '%s' "$candidate")
            jq -e \
              --arg tag "$TAG" \
              --arg commit "$COMMIT_SHA" \
              --arg extraction "$extraction" \
              --arg sha "$candidate_sha" \
              --argjson bytes "$candidate_bytes" \
              '.status == "passed" and .tag == $tag and .commit_sha == $commit and .publication_mode == "release" and .extraction == $extraction and .executable_sha256 == $sha and .executable_bytes == $bytes' \
              "$release_summary" > /dev/null
            env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" distributed-http \
              --binary "$candidate" \
              --evidence-root "$distributed_evidence" \
              --machine | tee "$distributed_summary"
            test "$(wc -l < "$distributed_summary")" -eq 1
            local distributed_receipt
            local distributed_receipt_sha256
            local distributed_receipt_digest
            distributed_receipt=$(jq -er '.receipt' "$distributed_summary")
            test "$distributed_receipt" = "$distributed_evidence/receipt.json"
            distributed_receipt_sha256=$(sha256sum "$distributed_receipt" | cut -d' ' -f1)
            test "$distributed_receipt_sha256" = "$(jq -er '.receipt_sha256' "$distributed_summary")"
            distributed_receipt_digest=$(jq -er '.receipt_digest' "$distributed_summary")
            local manifest_capabilities
            local manifest_version
            manifest_capabilities=$(jq -er '.executable.capabilities_digest' "$manifest")
            manifest_version=$(jq -er '.product.version' "$manifest")
            jq -e \
              --arg candidate_sha "$candidate_sha" \
              --arg version "$manifest_version" \
              --arg capabilities "$manifest_capabilities" \
              '.schema == {identity:"lkjscript-distributed-http-acceptance",version:2} and .workflow == "distributed-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.product_version == $version and .result.capabilities_digest == $capabilities and .result.authority_unchanged == true and .result.clean_incremental_equal == true and .result.restart_equal == true and .result.startup_failures_without_ready == 6 and (.result.responses | length) == 2 and .cleanup.runner_cleanup_complete == true and .cleanup.isolated_root_removed == true' \
              "$distributed_receipt" > /dev/null

            env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" outbound-http \
              --binary "$candidate" \
              --evidence-root "$outbound_evidence" \
              --machine | tee "$outbound_summary"
            test "$(wc -l < "$outbound_summary")" -eq 1
            local outbound_receipt
            local outbound_receipt_sha256
            local outbound_receipt_digest
            outbound_receipt=$(jq -er '.receipt' "$outbound_summary")
            test "$outbound_receipt" = "$outbound_evidence/receipt.json"
            outbound_receipt_sha256=$(sha256sum "$outbound_receipt" | cut -d' ' -f1)
            test "$outbound_receipt_sha256" = "$(jq -er '.receipt_sha256' "$outbound_summary")"
            outbound_receipt_digest=$(jq -er '.receipt_digest' "$outbound_summary")
            jq -e \
              --arg candidate_sha "$candidate_sha" \
              --arg version "$manifest_version" \
              --arg capabilities "$manifest_capabilities" \
              '.schema == {identity:"lkjscript-outbound-http-acceptance",version:1} and .workflow == "outbound-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.product_version == $version and .result.capabilities_digest == $capabilities and .result.authority_unchanged == true and .result.clean_incremental_equal == true and .result.restart_equal == true and .result.startup_failures_without_ready == 1 and (.result.responses | length) == 17 and (.result.no_connection | length) == 1 and .result.certificate.generator == "lkjscript-deterministic-ed25519-tls-fixture-1" and .cleanup.runner_cleanup_complete == true and .cleanup.oracle_cleanup_complete == true and .cleanup.isolated_root_removed == true and .cleanup.raw_secret_values_retained == false' \
              "$outbound_receipt" > /dev/null

            env -i LANG=C PATH=/usr/bin:/bin "$VERIFIER" stateful-http \
              --binary "$candidate" \
              --evidence-root "$stateful_evidence" \
              --machine | tee "$stateful_summary"
            test "$(wc -l < "$stateful_summary")" -eq 1
            local stateful_receipt
            local stateful_receipt_sha256
            local stateful_receipt_digest
            stateful_receipt=$(jq -er '.receipt' "$stateful_summary")
            test "$stateful_receipt" = "$stateful_evidence/receipt.json"
            stateful_receipt_sha256=$(sha256sum "$stateful_receipt" | cut -d' ' -f1)
            test "$stateful_receipt_sha256" = "$(jq -er '.receipt_sha256' "$stateful_summary")"
            stateful_receipt_digest=$(jq -er '.receipt_digest' "$stateful_summary")
            jq -e \
              --arg candidate_sha "$candidate_sha" \
              '.schema == {identity:"lkjscript-stateful-http-acceptance",version:4} and .workflow == "stateful-http-application" and .status == "passed" and .execution_context == "transferred" and .checkout_root == null and .isolated_root_outside_checkout == true and .candidate.sha256 == $candidate_sha and .copied_candidate.sha256 == $candidate_sha and .result.workflow == "stateful-http-application" and .result.initial_template == "minimal" and .result.initial_owners == 0 and .result.initial_dependencies == 0 and .result.dependency_staged == true and .result.topology.target_name == "serve" and .result.topology.runner == "http" and (.result.topology.requirements | keys) == ["clock","data","identifiers","streams"] and .result.idempotent_reconciliation == true and .result.deterministic == true and .result.incremental_sha256 == .result.clean_sha256 and .result.live.data_contract == "lkjscript-data-store-1" and .result.live.persistence_after_restart == true and .result.live.backup_restore_equivalent == true and .result.live.absent_root_no_ready == true and .result.live.corrupt_root_no_ready == true and .result.live.malformed_request_contained == true and .result.live.startup_failures_without_ready == 2 and .result.live.runner_starts == 3 and .result.live.shutdown_cleanup_failures == 0 and .result.live.temporary_data_cleanup_complete == true and .result.live.authority_unchanged == true and .cleanup.temporary_root_removed == true and .cleanup.data_cleanup_complete == true and .cleanup.runner_cleanup_complete == true and .cleanup.raw_secret_values_retained == false' \
              "$stateful_receipt" > /dev/null
            {
              echo "${label}_distributed_receipt=$distributed_receipt"
              echo "${label}_distributed_receipt_digest=$distributed_receipt_digest"
              echo "${label}_distributed_receipt_sha256=$distributed_receipt_sha256"
              echo "${label}_outbound_receipt=$outbound_receipt"
              echo "${label}_outbound_receipt_digest=$outbound_receipt_digest"
              echo "${label}_outbound_receipt_sha256=$outbound_receipt_sha256"
              echo "${label}_stateful_receipt=$stateful_receipt"
              echo "${label}_stateful_receipt_digest=$stateful_receipt_digest"
              echo "${label}_stateful_receipt_sha256=$stateful_receipt_sha256"
              echo "${label}_candidate_sha256=$candidate_sha"
              echo "${label}_manifest=$manifest"
            } >> "$GITHUB_OUTPUT"
          }

          verify_public_application exact "$EXACT"
          verify_public_application latest "$LATEST"
          cmp "$root/exact-extracted/lkjscript" "$root/latest-extracted/lkjscript"
          cmp "$root/exact-extracted/RELEASE-MANIFEST.json" "$root/latest-extracted/RELEASE-MANIFEST.json"
          test "$(jq -er '.candidate.sha256' "$root/exact-distributed-http/receipt.json")" = \
            "$(jq -er '.candidate.sha256' "$root/latest-distributed-http/receipt.json")"
          test "$(jq -er '.result.capabilities_digest' "$root/exact-distributed-http/receipt.json")" = \
            "$(jq -er '.result.capabilities_digest' "$root/latest-distributed-http/receipt.json")"
          test "$(jq -er '.result.responses[0].body_sha256' "$root/exact-distributed-http/receipt.json")" = \
            "$(jq -er '.result.responses[0].body_sha256' "$root/latest-distributed-http/receipt.json")"
          test "$(jq -er '.candidate.sha256' "$root/exact-outbound-http/receipt.json")" = \
            "$(jq -er '.candidate.sha256' "$root/latest-outbound-http/receipt.json")"
          test "$(jq -er '.result.capabilities_digest' "$root/exact-outbound-http/receipt.json")" = \
            "$(jq -er '.result.capabilities_digest' "$root/latest-outbound-http/receipt.json")"
          test "$(jq -er '.result.responses[0].body_sha256' "$root/exact-outbound-http/receipt.json")" = \
            "$(jq -er '.result.responses[0].body_sha256' "$root/latest-outbound-http/receipt.json")"
          test "$(jq -er '.candidate.sha256' "$root/exact-stateful-http/receipt.json")" = \
            "$(jq -er '.candidate.sha256' "$root/latest-stateful-http/receipt.json")"

      - name: Retain bounded exact and latest public application evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-application-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-verification/*-release-summary.json
            ${{ runner.temp }}/public-verification/*-distributed-http-summary.json
            ${{ runner.temp }}/public-verification/*-outbound-http-summary.json
            ${{ runner.temp }}/public-verification/*-stateful-http-summary.json
            ${{ runner.temp }}/public-verification/*-extracted/RELEASE-MANIFEST.json
            ${{ runner.temp }}/public-verification/*-distributed-http/receipt.json
            ${{ runner.temp }}/public-verification/*-distributed-http/*.log
            ${{ runner.temp }}/public-verification/*-outbound-http/receipt.json
            ${{ runner.temp }}/public-verification/*-outbound-http/*.log
            ${{ runner.temp }}/public-verification/*-stateful-http/receipt.json
            ${{ runner.temp }}/public-verification/*-stateful-http/*.log
            ${{ runner.temp }}/verifier-handoff/verifier-identity.json
            ${{ runner.temp }}/verifier-verify-summary.json
            ${{ runner.temp }}/verifier-artifact.json
            ${{ runner.temp }}/*-attestation.json
            ${{ runner.temp }}/*-attestation.stderr
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 6
