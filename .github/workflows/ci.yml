name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --quiet --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --quiet --workspace --all-targets --all-features --locked
      - run: cargo build --quiet --workspace --release --locked
