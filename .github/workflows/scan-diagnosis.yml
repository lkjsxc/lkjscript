name: Scan acceptance diagnosis
run-name: Scan stack diagnosis ${{ github.sha }}
on:
  push:
    branches: ['work/202609200012-sustained']
    paths: ['.github/workflows/scan-diagnosis.yml']
permissions:
  contents: read
concurrency:
  group: scan-diagnosis-202609200012
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '0'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind diagnostic source and preserve a recoverable delta
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scan-diagnosis"
          mkdir -m 0700 "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git bundle create "$out/source.bundle" HEAD ^HEAD^
          jq -n --arg source "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source:$source,tree:$tree,repository:$repository,run:$run,attempt:$attempt}' \
            > "$out/context.json"
          { uname -a; free -h; command -v gdb; } > "$out/environment.txt"
      - name: Build the exact default-profile library tests
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          out="$RUNNER_TEMP/scan-diagnosis"
          { rustc --version --verbose; cargo --version; } >> "$out/environment.txt"
          cargo test --locked --all-features --lib --no-run --message-format=json \
            > "$out/build.jsonl" 2> "$out/build.stderr"
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "lkjscript" \
            and .profile.test == true and .executable != null) | .executable' \
            "$out/build.jsonl" > "$out/executable.txt"
          test "$(wc -l < "$out/executable.txt")" = 1
          sha256sum "$(cat "$out/executable.txt")" > "$out/executable.sha256"
      - name: Reproduce and locate the stack failure without increasing its limit
        shell: bash
        run: |
          set -uo pipefail
          ulimit -c 0
          out="$RUNNER_TEMP/scan-diagnosis"
          exe="$(cat "$out/executable.txt")"
          filter='platform::execution::normalized::vm::checked::tests::map_tests'
          timeout 180 "$exe" "$filter" --test-threads=1 --nocapture \
            > "$out/tests.stdout" 2> "$out/tests.stderr"
          status=$?
          printf '%s\n' "$status" > "$out/tests.exit"
          if test "$status" -ne 0; then
            timeout 180 gdb --batch -ex 'set pagination off' -ex 'set confirm off' \
              -ex run -ex 'thread apply all bt 36' --args "$exe" "$filter" \
              --test-threads=1 --nocapture > "$out/backtrace.txt" 2>&1
            printf '%s\n' "$?" > "$out/gdb.exit"
          fi
          exit "$status"
      - name: Retain exact diagnostic evidence even after the expected failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-diagnosis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-diagnosis
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
