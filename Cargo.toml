[package]
name = "lkjscript"
version = "0.2.0"
edition = "2024"
# Language entry points use World; the rustc conformance shim supplies the host.
autoexamples = false

[lib]
path = "bridge/lib.rs"

[[bin]]
name = "lkjscript"
path = "bridge/main.rs"

[[bin]]
name = "lkjscript-backend"
path = "bridge/backend.rs"
test = false

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
exit = "deny"
mem_forget = "deny"
# Keep explicit loops, branches, references and initialization inside the bootstrap subset.
explicit_auto_deref = "allow"
mem_replace_with_default = "allow"
manual_map = "allow"
manual_div_ceil = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
manual_flatten = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
# Source slice/Vec fill is not implemented; retain explicit initialization loops.
manual_slice_fill = "allow"
match_like_matches_macro = "allow"
needless_lifetimes = "allow"
needless_late_init = "allow"
needless_range_loop = "allow"
same_item_push = "allow"
assign_op_pattern = "allow"
len_zero = "allow"
needless_return = "allow"
ptr_arg = "allow"
map_entry = "allow"

# Map lookups use the declared key type; heterogeneous borrowed-key lookup is absent.
unnecessary_to_owned = "allow"
# Keep explicit Option handling where helpers are absent or a lookup loan must end.
option_as_ref_deref = "allow"
unnecessary_unwrap = "allow"
manual_unwrap_or_default = "allow"
# Concrete cursors and Vec iteration avoid absent adapters and owned-array IntoIterator.
explicit_counter_loop = "allow"
while_let_on_iterator = "allow"
useless_vec = "allow"
# These host convenience methods/functions are outside the current source library.
manual_swap = "allow"
manual_strip = "allow"
implicit_saturating_sub = "allow"
