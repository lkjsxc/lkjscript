[workspace]
members = [
    "crates/lkjscript-ir",
    "crates/lkjscript-core",
    "crates/lkjscript-compiler",
    "crates/lkjscript-native",
    "crates/lkjscript-jit",
    "crates/lkjscript-sys",
    "crates/lkjscript-vm",
    "crates/lkjscript-app",
    "crates/lkjscript-xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
