[package]
name = "lkjscript"
version = "0.2.0"
edition = "2024"
# Language entry points use World; the rustc conformance shim supplies the host.
autoexamples = false

[lib]
path = "bridge/lib.rs"

[[bin]]
name = "lkjscript"
path = "bridge/main.rs"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"
