[package]
name = "lkjscript"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lkjscript"
path = "bridge/main.rs"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
exit = "deny"
mem_forget = "deny"
# Keep explicit loops, branches and matches inside the bootstrap subset.
collapsible_if = "allow"
collapsible_match = "allow"
manual_flatten = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
# Source slice/Vec fill is not implemented; retain explicit initialization loops.
manual_slice_fill = "allow"
match_like_matches_macro = "allow"
needless_lifetimes = "allow"
needless_late_init = "allow"
needless_range_loop = "allow"
same_item_push = "allow"
assign_op_pattern = "allow"
len_zero = "allow"
needless_return = "allow"
ptr_arg = "allow"
map_entry = "allow"
