[package]
name = "lkjscript"
version = "0.1.18"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
members = [".", "tools/lkjscript-dev"]
resolver = "3"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bincode = { version = "2.0.1", default-features = false, features = ["derive", "std"] }
blake3 = "1.8.2"
bytes = "1.12.1"
fs2 = "0.4.3"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3.4"
httparse = "1.10.1"
object_store = { version = "0.14.1", default-features = false, features = ["aws", "fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.23.0"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
