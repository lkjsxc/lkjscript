[package]
name = "lkjscript"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = "1.8.2"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
signal-hook = { version = "0.3.18", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["event", "fs", "std"] }
unicode-width = { version = "0.2.2", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[patch.crates-io]
# Crossterm 0.29.0 spins after a Unix terminal endpoint returns EOF or EIO.
# Keep the published source and patch only its non-retryable read handling.
crossterm = { path = "vendor/crossterm" }

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
