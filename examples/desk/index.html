<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>連絡帳</title>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1c1b19; --soft: #6b6862; --faint: #a09c94; --line: #e7e3da;
    --accent: #2f5fb0; --accent-ink: #ffffff; --ok: #3d8a5f; --bad: #b8443a; --run: #c08a1e; --mine: #eef2fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141516; --panel: #1b1d1f; --ink: #e9e7e2; --soft: #a3a09a; --faint: #6f6d68; --line: #2a2c2f;
      --accent: #8fb3f0; --accent-ink: #10141c; --ok: #6fbf92; --bad: #e0857c; --run: #dab45a; --mine: #1d2430;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: .02em; }
  header span { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 12px; font-weight: 600; color: var(--soft); margin: 28px 0 8px; letter-spacing: .08em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .ask { padding: 14px; margin-bottom: 10px; border-color: var(--accent); }
  .ask p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; min-height: 38px; }
  button:hover { border-color: var(--faint); }
  button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  textarea, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; width: 100%; }
  textarea { min-height: 76px; resize: vertical; display: block; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .say { display: grid; gap: 8px; }
  .say .row { justify-content: flex-end; }
  .ask input { flex: 1 1 180px; width: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  .jobs li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: baseline;
    padding: 9px 14px; border-top: 1px solid var(--line); }
  .jobs li:first-child, .feed li:first-child { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); align-self: center; }
  .running .dot { background: var(--run); } .ok .dot, .done .dot { background: var(--ok); }
  .failed .dot, .dead .dot { background: var(--bad); }
  .jobs b { font-weight: 600; } .jobs small, .feed time { color: var(--faint); font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jobs em { display: block; font-style: normal; color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .feed li { padding: 10px 14px; border-top: 1px solid var(--line); display: grid;
    grid-template-columns: 1fr auto; gap: 4px 12px; }
  .feed p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .feed .owner { background: var(--mine); }
  .feed .who { grid-column: 1 / -1; color: var(--faint); font-size: 12px; }
  .feed .ask p::before { content: "？ "; color: var(--accent); }
  .empty { color: var(--faint); padding: 12px 14px; font-size: 13px; }
  details { margin-top: 28px; } summary { cursor: pointer; color: var(--soft); font-size: 12px;
    letter-spacing: .08em; font-weight: 600; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 ui-monospace, monospace;
    color: var(--soft); padding: 14px; margin: 8px 0 0; }
</style>
<main>
  <header><h1>連絡帳</h1><span id="clock"></span></header>
  <section id="asks"></section>
  <form class="say" id="say">
    <textarea id="text" placeholder="AI に伝える" aria-label="AI に伝える"></textarea>
    <div class="row"><span id="say-status" role="status"></span><button class="go" id="send" disabled>送る</button></div>
  </form>
  <h2>いま</h2>
  <ul class="card jobs" id="jobs"></ul>
  <h2>できごと</h2>
  <ul class="card feed" id="feed"></ul>
  <details><summary>くわしい状態</summary><pre class="card" id="detail"></pre></details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const pad = (n) => String(n).padStart(2, '0');
const stamp = (t) => { const d = new Date(t * 1000);
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let last = '', loading = 0;
const cards = new Map();

async function say(text, re, request) {
  const response = await fetch('say', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Desk': '1' },
    body: JSON.stringify({ text, re, request }) });
  if (!response.ok) throw new Error('送信できませんでした。もう一度お試しください。');
  const row = await response.json();
  ++loading; last = '';
  $('feed').prepend(feedRow({ ...row, kind: 'owner' }));
  return row;
}

function askCard(a) {
  let pending = false;
  const status = el('p', { role: 'status', hidden: true });
  const input = el('input', { placeholder: '返事', ariaLabel: '返事' });
  const submit = async (text) => {
    if (pending || !text.trim()) return;
    pending = true;
    for (const control of [input, send, ...quick]) control.disabled = true;
    status.hidden = false; status.textContent = '送信中…';
    try {
      await say(text, a.id);
      card.remove(); cards.delete(a.id);
      await load();
    } catch {
      status.textContent = '送信できませんでした。もう一度お試しください。';
    } finally {
      pending = false;
      for (const control of [input, send, ...quick]) control.disabled = false;
    }
  };
  const send = el('button', { className: 'go', textContent: '返す', onclick: () => submit(input.value) });
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send.click(); } };
  const quick = (a.options || ['はい', 'いいえ', '任せる']).map((o) => el('button', { textContent: o, onclick: () => submit(o) }));
  const card = el('div', { className: 'card ask' }, el('p', { textContent: a.text }),
    el('div', { className: 'row' }, ...quick), el('div', { className: 'row', style: 'margin-top:8px' }, input, send), status);
  return card;
}

const STATES = { running: '実行中', ok: '完了', done: '完了', failed: '失敗', dead: '停止', cancelled: '中止', skipped: '見送り' };
function jobRow(line) {
  const w = line.replace(/^external /, '').split(' ');
  const name = w[0]; const status = STATES[w[1]] ? w[1] : 'ok'; const rest = w.slice(1).join(' ');
  const mins = (rest.match(/(?:^| )(\d+)m(?: |$)/) || [])[1];
  const note = (rest.match(/note=(.*?)(?: report=|$)/) || [])[1] || '';
  return el('li', { className: status }, el('span', { className: 'dot' }),
    el('div', {}, el('b', { textContent: name }), note ? el('em', { textContent: note }) : null),
    el('small', { textContent: STATES[status] + (status === 'running' && mins ? ` ${mins}分` : '') }));
}

function feedRow(r) {
  const who = r.kind === 'owner' ? (r.read ? 'あなた・既読' : 'あなた') : r.from + (r.kind === 'ask' && !r.open ? '・回答済み' : '');
  return el('li', { className: r.kind }, el('p', { textContent: r.text }), el('time', { textContent: stamp(r.t) }),
    el('span', { className: 'who', textContent: who }));
}

async function load() {
  const version = ++loading;
  let s; try { const response = await fetch('state'); if (!response.ok) return; s = await response.json(); } catch { return; }
  if (version !== loading) return;
  $('clock').textContent = stamp(s.now);
  const key = JSON.stringify([s.asks, s.feed, s.jobs, s.detail]);
  if (key === last) return; last = key;
  const open = new Set(s.asks.map((a) => a.id));
  for (const [id, card] of cards) if (!open.has(id)) { card.remove(); cards.delete(id); }
  for (const a of s.asks) if (!cards.has(a.id)) {
    const card = askCard(a); cards.set(a.id, card); $('asks').append(card);
  }
  const jobs = [...s.jobs].sort((x, y) => / running /.test(y) - / running /.test(x));
  $('jobs').replaceChildren(...(jobs.length ? jobs.map(jobRow) : [el('li', { className: 'empty', textContent: '動いているものはありません' })]));
  $('feed').replaceChildren(...(s.feed.length ? s.feed.map(feedRow) : [el('li', { className: 'empty', textContent: 'まだありません' })]));
  $('detail').textContent = s.detail;
  document.title = s.asks.length ? `(${s.asks.length}) 連絡帳` : '連絡帳';
}

let sending = false, message = null;
$('text').oninput = () => { $('send').disabled = sending || !$('text').value.trim(); };
$('text').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('say').requestSubmit(); } };
$('say').onsubmit = async (e) => {
  e.preventDefault(); const t = $('text').value.trim(); if (sending || !t) return;
  if (!message || message.text !== t) message = { text: t, id: crypto.randomUUID() };
  sending = true; $('send').disabled = true; $('text').disabled = true;
  $('say-status').textContent = '送信中…';
  try {
    await say(t, undefined, message.id);
    $('text').value = ''; message = null;
    $('say-status').textContent = '送信しました';
    await load();
  } catch {
    $('say-status').textContent = '送信できませんでした。もう一度お試しください。';
  } finally {
    sending = false; $('text').disabled = false; $('send').disabled = !$('text').value.trim();
  }
};
load(); setInterval(() => { if (!document.hidden) load(); }, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</html>
