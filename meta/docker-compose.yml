services:
  lkjscript:
    profiles: ["run"]
    build:
      context: ..
      dockerfile: meta/Dockerfile
      target: runtime
    command: ["run", "src/examples/hello/main.lkjscript"]
    working_dir: /usr/local/share/lkjscript
    stdin_open: true
    tty: true

  mandelbrot:
    profiles: ["run"]
    build:
      context: ..
      dockerfile: meta/Dockerfile
      target: runtime
    command: ["run", "src/examples/mandel/main.lkjscript"]
    working_dir: /usr/local/share/lkjscript
    stdin_open: true
    tty: true

  lkjedit:
    profiles: ["run"]
    build:
      context: ..
      dockerfile: meta/Dockerfile
      target: runtime
    command: ["run", "src/examples/lkjedit/main.lkjscript"]
    working_dir: /usr/local/share/lkjscript
    stdin_open: true
    tty: true

  http:
    profiles: ["run"]
    build:
      context: ..
      dockerfile: meta/Dockerfile
      target: runtime
    command: ["run", "src/examples/http/hello.lkjscript"]
    working_dir: /usr/local/share/lkjscript
    ports:
      - "8080:8080"

  verify:
    profiles: ["verify"]
    build:
      context: ..
      additional_contexts:
        repository-git: ../.git
      dockerfile: meta/Dockerfile
      target: verified
    entrypoint: ["cat"]
    command: ["/tmp/lkjscript-verification-result"]
